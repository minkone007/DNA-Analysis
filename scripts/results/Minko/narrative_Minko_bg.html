 CA за намаляване на меланина се простира отвъд цвета на очите. Същото намаляване на ензима, което изсветлява ириса, намалява и UV-защитния еумеланин в кожата — с реални последици за натрупването на увреждания от слънцето, разгледани в раздела за кожата.</p>"}, "hair_color": {"name": "Цвят на косата", "bespoke": "<p>Генетиката на цвета на косата разказва ясна и последователна история: средно до тъмнокафява, без червен компонент. Генът MC1R — който функционира като основен превключвател между червен/жълт феомеланин и тъмен еумеланин — не показва рискови варианти на нито едно от четирите тествани места (Arg151Cys, Arg160Trp, Arg163Gln, Cys289Arg). Това практически изключва червената коса. Наследили сте напълно функционален MC1R рецептор, което означава, че меланоцитите ви произвеждат еумеланин по подразбиране.</p><p>Доминиращият пигментационен сигнал е SLC45A2 GG — предковият алел, разпространен сред неевропейски и по-тъмно пигментирани популации, който не допринася за европейския вариант на изсветляване на косата. Комбиниран с липсата на MC1R варианти, това установява ясна тъмна основа.</p><p>Единственият умерен сигнал за изсветляване идва от TYR AC (хетерозиготен при rs1042602), който намалява ефективността на ензима тирозиназа. Това е умерен ефект — може да допринесе за известно омекотяване на най-тъмния възможен нюанс, поради което прогнозата е средно до тъмно, а не черна. SLC24A4 GT е междинен и не добавя значимо изсветляване.</p><p>Обобщение: тъмнокафява коса, дължаща се на здрава система за производство на еумеланин, с леко смекчаване от страна на TYR, което предотвратява абсолютно черния цвят. Факторите на средата (слънце, стареене) ще оказват влияние, но генетичната основа е ясна.</p>"}, "skin_tone": {"name": "Цвят на кожата", "bespoke": "<p>Генетиката на пигментацията на кожата разкрива интересно напрежение между два противоположни фактора, което произвежда среден, а не краен резултат в някоя от посоките.</p><p>Сигналът за изсветляване е съществен: SLC24A5 AA е производният европейски алел на единствения най-влиятелен локус за цвета на кожата. Тази вариация се е разпространила сред европейските и южноазиатски популации преди около 8000 години — вероятно като адаптация към среди с ниско UV лъчение с цел ефективен синтез на витамин D. Нейният ефект е достатъчно голям, за да обясни голяма част от разликата в пигментацията между европейското и западноафриканското население.</p><p>Противовесът е SLC45A2 GG — предковият алел на втори голям пигментационен ген. За разлика от европейския вариант CC, вариантът GG не допринася за допълнително изсветляване. Това създава реален противовес: SLC24A5 насочва към светла кожа, докато SLC45A2 задържа процеса, давайки светъл до среден тон, а не изключително бледа кожа.</p><p>TYR CA (хетерозиготен) намалява меланиновия изход, добавяйки склонност към лунички и намалена UV защита. Кожата ви изгаря по-лесно, отколкото почернява. Употребата на SPF50 не е прекалена предпазливост, а подходяща основна защита, прилагана редовно. Фицпатрик тип III е точно описание за тази комбинация.</p>"}, "hair_loss": {"name": "Косопад", "bespoke": "<p>Генетиката на косопада разказва обнадеждаваща история. X-свързаният AR/EDA2R локус — най-силният сигнал за мъжки тип алопеция, с OR над 2.0 в публикувани GWAS — показва rs2497938 CC, което е генотипът без риск. Този локус се наследява по майчина линия (на X хромозомата), което означава, че сигналът, който носите от майка си, не показва класическата предразположеност към андрогенна алопеция в тази основна позиция.</p><p>GWAS потвърждава това: само 1 повишен локус от 15 тествани, с полигенен резултат от +2.8 — най-ниският значим полигенен резултат в целия профил. Мъжкият тип алопеция е около 80% наследствена, което прави този нисък генетичен сигнал наистина информативен.</p><p>Чувствителността на AR рецептора и нивата на превръщане на DHT имат и други генетични фактори (като 5-алфа редуктаза), които не са напълно уловени тук, но основният сигнал е благоприятен.</p>"}, "height": {"name": "Ръст", "bespoke": "<p>Ръстът е едно от най-полигенните черти в човешкия геном — хиляди варианти, всеки допринасящ с части от милиметъра. Вашият полигенен резултат от +401 от 29 повишени локуса е вторият по величина количествен резултат в профила (след когнитивния потенциал) и последователно сочи над средното за населението.</p><p>HMGA2 rs1042725 TT е добре охарактеризираният куриран локус на вашия чип. HMGA2 е транскрипционен фактор, регулиращ растежа и развитието — TT на тази позиция е генотипът, свързан с по-висок ръст, допринасящ с приблизително 0.4 cm на алел в мащабни проучвания.</p><p>GWAS повишените локуси включват хитове в пътища, регулиращи растежа на костите и IGF-1 сигнализацията. Този генетичен сигнал е в съответствие с над средния потенциал за ръст, въпреки че реалният ръст зависи съществено от храненето в детството, съня и общото здраве.</p>"}, "cholesterol": {"name": "Холестерол / LDL", "bespoke": "<p>Генетиката на холестерола ви представя смесена, но в крайна сметка умерена картина. Най-важното откритие е това, което липсва: носите rs7412 CC, което е сигналът за APOE ε2 алела — свързан с по-нисък LDL и намален сърдечно-съдов риск в сравнение с честия генотип ε3/ε3. Това е наистина благоприятна находка на най-значимия клиничен локус за холестерол.</p><p>Важно предупреждение е, че rs429358 — вторият SNP, необходим за пълното определяне на APOE генотипа — не е бил на вашия чип. Това означава, че не можем да изключим напълно смесен генотип ε2/ε4, който би намалил защитния ефект на ε2. Клиничен тест за APOE генотип (евтин и достъпен) би изяснил това окончателно.</p><p>Освен APOE: rs629301 TT при SORT1/CELSR2 носи две копия на алела, повишаващ LDL. rs11591147 GG при PCSK9 не показва защитен алел за намаляване на функцията. LPA rs10455872 AA не е рисков — не носите варианта, повишаващ Lp(a), което е отлична защитна находка, тъй като Lp(a) е независим рисков фактор.</p><p>Обобщение: диетата и физическата активност остават първа линия на подход. Препоръчват се ежегодни липидни панели и изясняване на пълния APOE статус.</p>"}, "triglycerides": {"name": "Триглицериди", "bespoke": "<p>Генетиката на триглицеридите показва умерено повишение с един важен защитен противовес. Основният рисков сигнал е APOA5 AG (rs662799 хетерозиготен) — доминиращият триглицериден локус, чийто G алел нарушава функцията на APOA5 за активиране на липопротеинова липаза (LPL), което забавя изчистването на триглицеридите. Този ефект се засилва при прием на въглехидрати и алкохол.</p><p>APOC3 AG (rs2266788) добавя вторичен сигнал — APOC3 нормално инхибира LPL, а този вариант увеличава изявата му, допълнително забавяйки клирънса. MTNR1B CG влияе умерено на триглицеридите на гладно.</p><p>Ключовата защитна находка е LPL rs328 CC — вариантът S447X с придобита функция. Той е наистина защитен: C алелът създава хиперактивна форма на липопротеинова липаза, която съществено подобрява изчистването на мазнините от кръвта. Този защитен алел балансира рисковете от APOA5 и APOC3.</p><p>Хранителни препоръки: намалете бързите въглехидрати и алкохола. Омега-3 добавките (EPA/DHA, 2-4g дневно) са изключително ефективни при носители на варианти на APOA5, като проучванията показват 20-30% намаление на триглицеридите.</p>"}, "cad": {"name": "Коронарна артериална болест", "bespoke": "<p>Коронарната артериална болест (КАБ) е областта, в която генетичният профил показва най-значимото клинично повишение. Локусът 9p21 (CDKN2B-AS1) — най-репликираният общ вариант за КАБ в научната литература — се появява два пъти във вашите данни: rs4977574 AG и rs1333049 CG (и двата с едно рисково копие). Ефектите на тези два варианта са адитивни и добре проучени.</p><p>Важното за локуса 9p21 е, че той действа независимо от нивата на LDL холестерола. Неговият механизъм включва регулиране на клетъчната пролиферация в гладките мускули на съдовете и възпалителните пътища — което означава, че стандартните изследвания на холестерола няма да уловят този риск. Човек с нормален холестерол и рискови алели при 9p21 все още има повишен риск от КАБ спрямо базовото население.</p><p>Допълнителни сигнали: rs646776 TT при CELSR2/SORT1 допринася за риска по липидния път. LPL rs264 GG е защитният алел, подобряващ клирънса. GWAS показва 25 повишени локуса и PGS от +111. Препоръчва се проследяване на кръвното налягане, липидите, избягване на тютюнопушенето и изследване на hsCRP като маркер за съдово възпаление.</p>"}, "heart_failure": {"name": "Сърдечна недостатъчност", "bespoke": "<p>Генетичният ви профил за сърдечна недостатъчност показва леко натоварване, включващо предимно пътища, свързани с миокардния стрес и стабилността на саркомерите. Генове като <strong>BAG3</strong> (rs2234962) и <strong>ALPK2</strong> са водещи в GWAS проучванията за дилатативна кардиомиопатия. Тези варианти не показват структурни дефекти, но предполагат, че при хронично високо кръвно налягане или стрес, сърдечният мускул може да има по-нисък праг на издръжливост.</p><p>Протективните мерки са много ефективни: редовни аеробни тренировки (зона 2) за подобряване на еластичността на камерите и миокардната съдова мрежа, както и поддържане на оптимално кръвно налягане, което директно намалява натоварването върху сърцето. Избягването на токсични за сърцето влияния (като прекомерен алкохол) е силно препоръчително за този профил.</p>"}, "atrial_fibrillation": {"name": "Предсърдно мъждене", "bespoke": "<p>Генетичният риск за предсърдно мъждене е свързан главно с транскрипционни фактори, регулиращи електрическата проводимост на сърцето и развитието на предсърдията. Ключовите локуси са <strong>PITX2</strong> (rs10033464) и <strong>ZFHX3</strong>. Вариантите тук променят развитието на белодробните венозни ръкави, където най-често възникват извънредни електрически импулси.</p><p>Индивидите с тези варианти могат да бъдат по-чувствителни към стимуланти, предизвикващи симпатикови пикове. Практически съвет: ограничете стимуланти като прекомерен кофеин, алкохол и хронично недоспиване. Редовно спортуващите с този профил трябва да поддържат добър електролитен баланс (магнезий и калий) за стабилизиране на електрическата активност на сърцето.</p>"}, "stroke": {"name": "Инсулт", "bespoke": "<p>Генетичната предразположеност към инсулт показва умерено полигенно натоварване, което се разбира най-добре чрез разделяне на инсулта на основните му видове: исхемичен и хеморагичен. Вариантите близо до <strong>HDAC9</strong> (rs2107595) са свързани с исхемичен инсулт на големите артерии, влияейки на артериалната калцификация и стабилността на ендотела.</p><p>Тъй като рискът се влияе силно от съдовото здраве, управлението на кръвното налягане и контролът на възпалението са най-силните превантивни лостове. Препоръчва се диета, богата на антиоксиданти, и редовно проследяване на състоянието на каротидните артерии. Контролът на нивата на хомоцистеин (свързан с MTHFR профила ви) също е критичен за предпазване на микросъдовете.</p>"}, "blood_pressure": {"name": "Кръвно налягане", "bespoke": "<p>Есенциалната хипертония е силно полигенно състояние, регулирано главно чрез бъбречното отделяне на натрий и съдовия тонус. Вариантите в локусите <strong>AGT</strong> (ангиотензиноген) и <strong>ADD1</strong> (адуцин 1) сочат към повишена чувствителност към съотношението на натрий и калий в диетата.</p><p>При диета с високо съдържание на сол и ниско съдържание на калий, бъбреците задържат вода по-агресивно, повишавайки обема на кръвта и съдовото съпротивление. Препоръка: приоритизирайте богата на калий диета (авокадо, зеленолистни зеленчуци, кокосова вода), ограничете рафинираната сол и правете редовни аеробни упражнения за поддържане на еластичността на съдовете.</p>"}, "t2d": {"name": "Диабет тип 2", "bespoke": "<p>Генетичният профил за диабет тип 2 (T2D) изисква внимателен прочит, защото общото число — повишен риск — скрива важен модел в детайлите.</p><p>Вие сте хетерозиготни почти на всеки основен T2D локус: TCF7L2 CT (едно рисково копие), KCNJ11 CT, SLC30A8 TC, CDKN2A/B CT, HHEX TC, IGF2BP2 GT, FTO CA. Тази последователна хетерозиготност на седем независими локуса е определящата характеристика на вашия профил — умерено генетично натоварване, разпределено широко, а не тежко натоварване на един ген.</p><p>Трите хомозиготни рискови хита (rs76895963 TT, rs10741243 GG, rs1631619 GG) засилват сигнала, но при rs1631619 GG съотношението на риск е изчислено по азиатска кохорта и ефектът в европейска популация може да е по-нисък.</p><p>TCF7L2 е най-важната находка — най-силно репликираният общ вариант за T2D. Той влияе на функцията на бета-клетките в панкреаса. Хетерозиготните носители имат около 1.4 пъти по-висок риск. Изключително важно: носителите реагират отлично на промени в начина на живот — проучванията показват, че физическата активност и диетичният контрол напълно неутрализират този генетичен риск. Контролът на кръвната захар и HbA1c на всеки няколко години е препоръчителен.</p>"}, "bmi": {"name": "ИТМ / Склонност към затлъстяване", "bespoke": "<p>Генетиката на ИТМ показва умерено натоварване, като ключовата находка е хетерозиготността за FTO. rs9939609 AT означава едно копие на рисковия алел на FTO (A) — всеки A алел добавя около 0.4 kg/m² към средния ИТМ. Вторичният вариант rs17817449 GT добавя малък допълнителен сигнал.</p><p>Важен противовес: rs2815752 AG при NEGR1 носи защитния алел (A). NEGR1 участва в регулирането на апетита, и този защитен вариант частично балансира сигнала от FTO.</p><p>Най-важното за вашия FTO генотип: мащабни мета-анализи показват, че генетичният ефект на FTO върху ИТМ се неутрализира почти напълно при редовна физическа активност. Предразположеността съществува, но дали ще се изяви, зависи изцяло от нивото на движение.</p>"}, "gout": {"name": "Подагра", "bespoke": "<p>Подаграта е възпалителен артрит, причинен от кристализиране на пикочна киселина в ставите, а генетиката ѝ се определя от бъбречните транспортни протеини. Геновете <strong>SLC2A9</strong> и <strong>ABCG2</strong> кодират транспортери, отговорни за секрецията и обратното усвояване на урати в бъбреците.</p><p>Рисковите варианти намаляват ефективността на изхвърляне на пикочната киселина през бъбреците, което води до повишаване на серумните нива. Този път е много чувствителен към фруктоза (която ускорява синтеза на пурини) и алкохол (който пречи на бъбречното изхвърляне). Добрата хидратация, ограничаването на пурините и поддържането на добра инсулинова чувствителност са основните превантивни мерки.</p>"}, "chronic_kidney_disease": {"name": "Хронично бъбречно заболяване", "bespoke": "<p>Бъбречният ви генетичен профил разкрива варианти в локусите <strong>UMOD</strong> (уромодулин) и <strong>SHROOM3</strong>, свързани с дългосрочно намаляване на скоростта на гломерулна филтрация (eGFR). Вариантите на UMOD могат да повлияят на секрецията на уромодулин, повишавайки уязвимостта към локални възпаления и фиброза.</p><p>Това не означава предразположеност към бъбречна недостатъчност, а по-нисък функционален резерв. За защита на бъбреците избягвайте редовния прием на нестероидни противовъзпалителни средства (като ибупрофен), поддържайте добър контрол на кръвното налягане и захарта и пийте достатъчно вода за намаляване на стреса върху нефроните.</p>"}, "vitamin_d": {"name": "Ниво на витамин D", "bespoke": "<p>Генетиката ви на витамин D показва нюансирана картина, която надхвърля обобщения „лек“ полигенен сигнал. Макар общият GWAS резултат да е само умерено повишен (+11.4), конкретните варианти разкриват неефективност на два ключови етапа: транспорт и клетъчно усвояване.</p><p><strong>Етап на транспорт (GC ген):</strong> Носите rs7041 CA (хетерозиготен) и rs4588 GG. Тази комбинация произвежда смес от протеини, свързващи витамин D, което води до умерено намалена ефективност при доставянето му до тъканите. Не е тежко нарушено, но намалява количеството био-наличен витамин D в сравнение с оптималните GC генотипове.</p><p><strong>Етап на рецептор (VDR ген):</strong> По-значителни са вашите VDR варианти — rs731236 AA (TaqI) и rs7975232 CC (ApaI). Тези маркери са свързани с намалена чувствителност на витамин D рецепторите. Това означава, че дори когато витамин D достигне до клетките, рецепторите, които трябва да задействат абсорбцията на калций и минерализацията на костите, реагират по-слабо.</p><p>Комбинираният ефект създава двустепенно намаляване на витамин D активността, което се свързва и с по-нисък капацитет за съхранение на калций в костите. Препоръка: поддържайте по-високи нива на серумен витамин D (50–70 ng/mL) и оптимизирайте ко-факторите: магнезий (300–400 mg/ден за активиране) и витамин K2 (MK-7, 100–200 mcg/ден за правилно насочване на калция в костите).</p>"}, "mthfr": {"name": "MTHFR / Метаболизъм на B-витамини", "bespoke": "<p>Генетиката на метаболизма на фолат и В-витамини е най-клинично приложимата хранителна находка в този доклад и заслужава внимателно разглеждане, тъй като липсваше от основния здравен доклад.</p><p>Носите два MTHFR варианта едновременно — сложна хетерозиготност, по-значима от всеки вариант поотделно:</p><p><strong>MTHFR C677T (rs1801133) GA — хетерозиготен.</strong> T алелът намалява активността на ензима MTHFR с около 35% при хетерозиготите. MTHFR е ключовият ензим, превръщащ фолата в активната форма (5-метилТХФ), използвана за рециклиране на хомоцистеин обратно до метионин. Намалената активност означава по-бавен клирънс на хомоцистеина и потенциално повишен плазмен хомоцистеин — рисков фактор за сърдечно-съдови и неврологични заболявания.</p><p><strong>MTHFR A1298C (rs1801131) GT — хетерозиготен.</strong> Комбиниран с C677T хетерозиготността, общата ензимна активност може да бъде намалена с 50-60%, доближавайки се до ефекта при хомозиготност.</p><p><strong>MTR A2756G AA</strong> и <strong>MTRR A66G GG</strong> показват липса на допълнителни нарушения в тези спомагателни ензими на метилирането.</p><p>Практически последици: приемайте директно активен <strong>метилфолат (5-MTHF)</strong>, а не синтетична фолиева киселина, която тялото ви не може да превърне лесно. Препоръчва се и активна форма на B12 (<strong>метилкобаламин</strong>). Изследването на хомоцистеин, фолат и B12 в кръвта е силно препоръчително.</p><p>Повишеният хомоцистеин е независим рисков фактор за КАБ и инсулт — области, в които имате леко завишени сигнали в GWAS. Този нутригенетичен подход предлага прост и доказано ефективен начин за балансиране на тези рискове.</p>"}, "intelligence": {"name": "Когнитивен профил", "bespoke": "<p>Когнитивната генетика съдържа най-високия полигенен резултат в целия доклад: PGS +1064 от 8 повишени локуса. Методологичен контекст: GWAS проучванията често включват образователните постижения като прокси, поради което резултатът отразява смес от когнитивни способности, образователна предразположеност и неврологична устойчивост.</p><p>Курираните генотипове предлагат интересен детайл. COMT rs4680 GG е генотипът Val/Val (профил „Воин“). По-високата ензимна активност на COMT означава бърз разпад на допамин в префронталния кортекс. Това води до по-добра работна памет и отлична изпълнителна функция под високо когнитивно натоварване и стрес, за сметка на малко по-ниски базови нива на допамин.</p><p>BDNF rs6265 CT (Val66Met хетерозиготен) е нюансиращ фактор. Met алелът намалява активност-зависимата секреция на BDNF (фактор на растежа на невроните). При хетерозиготност остава един напълно функционален Val алел. Този профил се повлиява изключително добре от аеробни упражнения — физическата активност е най-мощният стимулатор на BDNF синтеза и компенсира напълно ниските базови нива, подобрявайки паметта и пластичността.</p>"}, "alzheimer": {"name": "Болест на Алцхаймер", "bespoke": "<p>Генетичният профил за Алцхаймер съдържа може би най-обнадеждаващата находка в целия доклад. rs7412 CC съответства на APOE ε2 алела — а ε2 е най-силно известният защитен вариант срещу Алцхаймер с късно начало. Носителите на ε2 имат около 50% по-нисък риск спрямо честия генотип ε3/ε3 и са значително свръхпредставени сред здравите дълголетници.</p><p>Тъй като вторият маркер rs429358 не е изследван, не може да се изключи напълно смесен генотип ε2/ε4, но дори тогава защитният сигнал остава реален.</p><p>GWAS полигенният резултат от +171.6 изглежда в противоречие, но това се дължи на факта, че много проучвания в GWAS включват странични плеотропни маркери (като образование), докато клиничният риск се определя основно от APOE. Защитните стратегии: поддържане на сърдечно-съдовото здраве, редовна физическа активност, качествен сън (по време на който глимфатичната система изчиства амилоида) и когнитивна ангажираност.</p>"}, "parkinson": {"name": "Паркинсон", "bespoke": "<p>Генетиката на болестта на Паркинсон е свързана с процесите на лизозомно пречистване, митохондриалната функция и справянето с токсини в допаминергичните неврони. Макар да нямате тежки семейни мутации, полигенните вариации в локусите <strong>SNCA</strong> (алфа-синуклеин) и <strong>MAPT</strong> (тау протеин) предполагат леко променена скорост на изчистване на протеини.</p><p>Невровъзпалението и здравето на чревния микробиом играят важна роля като епигенетични фактори. Невропротективни навици: редовни аеробни тренировки, богата на антиоксиданти диета (зелен чай, плодове с тъмен цвят) и грижа за чревната бариера.</p>"}, "depression": {"name": "Депресия", "bespoke": "<p>Генетиката на депресията разказва нюансирана история. Високият полигенен резултат (+71.8) отразява повишено натоварване, но депресията е сложно състояние с голямо влияние на средата.</p><p>BDNF rs6265 CT означава едно копие на Val66Met — вариант, свързан с намалена секреция на растежния фактор BDNF при стрес. Това повишава биологичната чувствителност към стресови събития. Противовесът е COMT rs4680 GG (профил „Воин“), който осигурява добра когнитивна устойчивост под натиск.</p><p>Нивата на BDNF се влияят изключително силно от аеробните упражнения. Физическата активност е доказан начин за стимулиране на невронната пластичност и устойчивост, което прави движението директно биологично средство срещу депресивни състояния за вашия генотип.</p>"}, "adhd": {"name": "СДВХ", "bespoke": "<p>Генетиката на Синдрома на дефицит на вниманието и хиперактивност (СДВХ) е свързана с регулирането на допаминовия и норадреналиновия трансфер в мозъка. Локусите близо до <strong>DRD4</strong> и <strong>DAT1</strong> са често замесени. При тези варианти префронталният кортекс може да изчиства допамина твърде бързо, водещо до състояние на леко под-възбуждане.</p><p>Това често се усеща като нужда от постоянна стимулация или трудност при задържане на вниманието върху рутинни задачи. Този профил обаче предлага и предимства: способност за бързо превключване, творческо мислене и хиперфокус върху интересни теми. Подкрепата чрез структура на деня, високопротеинова диета и спорт е много полезна.</p>"}, "autism": {"name": "Аутизъм", "bespoke": "<p>Генетиката на аутистичния спектър включва варианти, регулиращи синаптичните молекули за клетъчна връзка (като невролигини <strong>NLGN3/4</strong> и <strong>SHANK3</strong>). Тези генове определят гъстотата и начина на свързване на невроните по време на ранното развитие.</p><p>Полигенният резултат отразява склонност към висока локална свързаност в определени области на мозъка, проявяваща се като дълбок фокус, хиперсистематизиране, повишена сензорна чувствителност и предпочитание към предвидима среда. Този профил често се справя отлично в области, изискващи разпознаване на модели и логика.</p>"}, "bipolar_disorder": {"name": "Биполярно разстройство", "bespoke": "<p>Генетиката на биполярното разстройство е свързана с калциевите канали в мозъка, особено геновете <strong>CACNA1C</strong> и <strong>ANK3</strong>. Те регулират вътреклетъчната калциева сигнализация, критична за синаптичната пластичност и циркадните ритми.</p><p>Вариантите тук могат да доведат до повишена възбудимост на невронните мрежи при нарушения на съня. Най-мощният стабилизиращ инструмент за този генетичен профил е стриктната хигиена на съня — лягането и събуждането по едно и също време стабилизират калциевите канали и действат като биологичен щит. Избягването на синя светлина вечер също е ключово.</p>"}, "schizophrenia": {"name": "Шизофрения", "bespoke": "<p>Полигенният резултат за шизофрения (+125.2) изисква сериозно контекстуализиране. Тези резултати имат слаба индивидуална предсказателна стойност — дори в най-високия децил на риска, вероятността от отключване на състоянието остава около 3-4% при 1% за базовото население.</p><p>Повечето рискови варианти се намират в HLA/MHC региона, отразяващ имунната система. Този модел (заедно с повишени маркери за лупус, артрит и колит) сочи към обща имунна и възпалителна чувствителност, а не към класически психиатричен риск.</p><p>Препоръките са стандартни: качествен сън, избягване на канабис (който е силен тригер при генетично предразположени хора) и поддържане на добра социална ангажираност.</p>"}, "sleep_duration": {"name": "Продължителност на съня", "bespoke": "<p>Генетичните фактори за продължителността на съня са свързани с циркадния часовник (<strong>CLOCK</strong>, <strong>PER2</strong>) и сънната хомеостаза. Те влияят на това колко бързо се натрупва аденозин в мозъка (усещането за умора) и колко ефективно се изчистват метаболитните отпадъци по време на сън.</p><p>Уважаването на личните нужди от сън е важно: независимо от продължителността, оптимизирането на качеството му (хладна и тъмна стая, без екрани преди сън) помага на глимфатичната система да извърши пълно пречистване на мозъка през нощта.</p>"}, "longevity": {"name": "Дълголетие", "bespoke": "<p>Генетиката на дълголетието показва умерени положителни сигнали, като картината с APOE е централна. rs7412 CC съответства на APOE ε2 алела — и ε2 е последователно свръхпредставен сред стогодишниците в множество независими кохортни проучвания. Механизмът е комплексен: по-нисък LDL, по-ниско възпаление в нервната система и по-нисък риск от Алцхаймер.</p><p>Вариантите на CETP добавят допълнителен сигнал. CETP rs3764814 CT и rs5882 AG сочат към по-висок HDL („добър“) холестерол, което е характерно за дълголетниците. FOXO3 (друг важен ген за дълголетие) не е тестван на вашия чип.</p><p>Всички проучвания показват, че начинът на живот — избягване на тютюнопушенето, редовно движение, средиземноморска диета и социални контакти — играе много по-голяма роля за достигане на дълбока старост, отколкото самите гени.</p>"}, "lactase_persistence": {"name": "Лактазна персистенция", "bespoke": "<p>Генетиката на лактазната персистенция изследва гена <strong>MCM6</strong>, който регулира LCT гена, отговорен за ензима лактаза. В миналото производството на лактаза е спирало след ранна възраст, но при европейските пастирски популации възниква мутация (rs4988235), позволяваща производството ѝ и в зряла възраст.</p><p>Ако имате предковия генотип GG, сте предразположени към непоносимост към лактоза, което може да причини дискомфорт при прием на прясно мляко. При генотипове AA или AG тялото продължава да произвежда лактаза, позволявайки безпроблемно усвояване на млечни продукти.</p>"}}, "immune_themes": {"Lupus": {"gene": "STAT4 и IRF5", "pathway": "интерферонова сигнализация", "management": "защита от слънце и управление на стреса"}, "Rheumatoid Arthritis": {"gene": "HLA-DQB1 и TYK2", "pathway": "HLA-медиирано автоимунитет", "management": "ранно проследяване на ставни симптоми"}, "Inflammatory Bowel": {"gene": "IL23R и HLA-DRB9", "pathway": "чревна имунна регулация", "management": "следене на диетични тригери и здраве на микробиома"}, "Crohn Disease": {"gene": "IL23R (множествени хитове)", "pathway": "дисрегулация на IL-23/Th17 пътя", "management": "управление на диетата и стреса"}, "Psoriasis": {"gene": "TYK2 и IL12B", "pathway": "възпалителна ос IL-23/IL-17", "management": "проследяване на кожата и UV грижа"}, "Multiple Sclerosis": {"gene": "HLA-DRB1 и IL2RA", "pathway": "миелинова автореактивност и имунно обучение", "management": "поддържане на нива на витамин D (>50 ng/mL)"}, "Asthma": {"gene": "ORMDL3/GSDMB и IL33", "pathway": "епителна бариера и Th2 хиперреактивност", "management": "избягване на алергени и грижа за лигавиците"}}, "cancer_specifics": {"Breast Cancer": "rs637644 GG (OR 32.50) и rs3844412 AA (OR 5.22) са водещите хитове, но тези стойности на риск вероятно са специфични за определени кохорти. rs78378222 TT при TP53 е по-универсално значим — TP53 е основният туморен супресор на генома. Вариантите на ESR1 отразяват хормоналния компонент. Препоръчва се стандартна профилактика.", "Prostate Cancer": "rs17632542 TT при KLK3 (гена за PSA) и rs138213197 CC при HOXB13 са клинично най-значимите хитове тук. KLK3 вариантът влияе на нивата на PSA независимо от рака, което може да усложни интерпретацията при скрининг. Обсъдете това със специалист преди изследвания.", "Colorectal Cancer": "Няколко хита сочат висок риск в малки проучвания, но по-устойчивите сигнали са rs885036 AA при MGAT4A и rs716897 TT при RASGRF2. Промените в начина на живот са високо ефективни: повече фибри, по-малко червено и преработено месо, спорт и колоноскопия след 45-50 години.", "Melanoma": "Сигналът за меланом е кохерентен и ясен. SLC45A2 GG (rs16891982) и IRF4 CT влияят пряко на биологията на меланоцитите и риска. В комбинация с намалената UV защита от пигментационния анализ (TYR вариант), слънцезащитата с висок фактор, редовните прегледи на бенки и избягването на изгаряне са задължителни.", "Lung Cancer": "rs17879961 AA при CHEK2 (ген за ДНК поправка) е доминиращият сигнал тук. Важно е да се знае, че генетичният риск за рак на белия дроб се доминира изцяло от статуса на пушач. При непушачи абсолютният риск остава много нисък, но при пушене тези варианти добавят сериозен допълнителен риск.", "Bladder Cancer": "Профилът за рак на пикочния мехур показва варианти в ксенобиотичния метаболизъм, по-специално NAT2 бавно ацетилиране и GSTM1 нулев генотип. Това намалява капацитета за изчистване на токсини. Основен съвет: избягвайте тютюнев дим и пийте много течности."}, "lifestyle_specifics": {"Alcohol Consumption": "<p>Генетиката ви за алкохол съдържа изключително висок коефициент на вероятност (OR 24.56) при rs1229984 CC в гена ADH1B. ADH1B превръща алкохола в ацеталдехид. Този генотип е свързан с по-бавна ензимна активност — ацеталдехидът се натрупва по-бавно, което намалява неприятното зачервяване и дискомфорт и в някои популации води до по-голяма консумация. Това описва метаболизма, а не поведенчески риск.</p><p>rs13107325 CC при SLC39A8 и rs1260326 CC при GCKR са допълнителни метаболитни варианти. GCKR влияе както на алкохолния, така и на глюкозния метаболизъм.</p><p>Практическо значение: тези варианти предполагат по-бавен метаболизъм на алкохола, което е важно предвид склонността към високи триглицериди (при които алкохолът има силно негативно влияние).</p>", "Caffeine Metabolism": "<p>rs56113850 TC при CYP2A6 управлява сигнала за кофеин. Този ензим разгражда както никотин, так и кофеин. Хетерозиготният генотип TC предполага междинна метаболитна активност.</p><p>Основният ген за кофеин — CYP1A2 (изчистващ 95% от кофеина) — не е директно представен в данните. Практически извод: вероятно имате умерено разграждане на кофеин. Ако кафето следобед пречи на съня ви, опитайте да го ограничите до обяд.</p>", "Pharmacogenomics": "<p>Данните за фармакогеномика показват три повишени локуса: rs77375493 GG при JAK2, rs749671 GA при ZNF646 и rs245880 AG при CPVL.</p><p>Най-важните клинични гени (като CYP2D6, CYP2C19, CYP2C9) не са включени в този набор. Тези гени определят метаболизма на антидепресанти, болкоуспокояващи и съдоразширяващи. Преди започване на важни медикаменти, специализиран фармакогенетичен панел би бил изключително полезен за избягване на странични ефекти.</p>"}, "generic": {"immune_base": "<p>Генетиката ви за {trait} показва повишен сигнал, движен главно от варианти в {gene}, засягащи {pathway}. С {elevated} повишени локуса и PGS от {pgs:+.1f}, това е значим сигнал.</p><p>Има важен модел в имунния ви профил: повишените сигнали се появяват при лупус, ревматоиден артрит, колит, Крон и псориазис. Тези състояния споделят обща генетична основа (особено HLA региона). Това предполага обща възпалителна чувствителност.</p><p>Начинът на живот е мощен инструмент: средиземноморска диета (омега-3, малко преработени храни), сън, управление на стреса и грижа за чревния микробиом. Практически фокус: {management}.</p><p>Споделете тези предразположения с вашия лекар, тъй като автоимунните състояния често се откриват трудно в ранна фаза.</p>", "cancer_base": "<p>GWAS данните за {trait} показват {elevated} повишени локуса с PGS от {pgs:+.1f}.</p><p>{detail}</p>", "gwas_summary_base": "<p>{pred} за {trait}. Полигенният резултат от GWAS е {pgs:+.1f} (над средното), с {elevated} локуса, показващи повишена дозировка на рисковия алел. Ключови гени: {genes}.</p><p>{narrative}</p>"}}};

const PHARMGKB = [];

let currentLang = 'en';
let currentCategory = 'all';
let currentRiskFilter = 'all';
let searchQuery = '';

// Initialize application
window.onload = function() {
  // Load saved theme preference
  if (localStorage.getItem('theme') === 'dark' || 
      (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }

  // Build the sidebar biological axes navigation dynamically
  renderSidebarAxes();

  // Populate overall statistics in hero banner
  calculateStatistics();

  // Set the default language strings
  switchLanguage('en');
};

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}

function renderSidebarAxes() {
  const container = document.getElementById('axes-list');
  container.innerHTML = '';
  
  SECTIONS.forEach(sec => {
    const count = sec.keys.filter(k => SYNTHESIS[k]).length;
    if (count === 0) return; // Skip empty sections

    const item = document.createElement('div');
    item.className = 'nav-item';
    item.id = `nav-${sec.id}`;
    item.onclick = function() {
      selectCategory(sec.id, item);
      // Close mobile menu if open
      document.getElementById('sidebar').classList.remove('open');
      
      // Smooth scroll to section in content
      const element = document.getElementById(`sec-${sec.id}`);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
    
    // Create localized span
    const nameSpan = document.createElement('span');
    nameSpan.id = `nav-label-${sec.id}`;
    nameSpan.innerText = sec.names[currentLang];
    
    item.innerHTML = `<span>${sec.icon}</span> `;
    item.appendChild(nameSpan);
    
    // Add count tag
    const countSpan = document.createElement('span');
    countSpan.style = 'margin-left: auto; font-size: 0.7rem; background: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.1rem 0.4rem; border-radius: 10px; color: var(--text-muted);';
    countSpan.innerText = count;
    item.appendChild(countSpan);
    
    container.appendChild(item);
  });
}

function calculateStatistics() {
  let total = 0, elevated = 0, moderate = 0, favourable = 0;
  
  Object.keys(SYNTHESIS).forEach(key => {
    total++;
    const pred = (SYNTHESIS[key].prediction || '').toLowerCase();
    
    if (pred.includes('elevated') || pred.includes('high risk')) {
      elevated++;
    } else if (pred.includes('favourable') || pred.includes('below average') || pred.includes('low risk')) {
      favourable++;
    } else {
      moderate++;
    }
  });
  
  // Smoothly increment stats counters
  animateCount('stat-total', total);
  animateCount('stat-elevated', elevated);
  animateCount('stat-moderate', moderate);
  animateCount('stat-favourable', favourable);
}

function animateCount(elemId, targetVal) {
  const el = document.getElementById(elemId);
  if (!el) return;
  let curr = 0;
  const step = Math.ceil(targetVal / 30);
  const timer = setInterval(() => {
    curr += step;
    if (curr >= targetVal) {
      curr = targetVal;
      clearInterval(timer);
    }
    el.innerText = curr;
  }, 20);
}

function switchLanguage(lang) {
  currentLang = lang;
  
  // Update toggle state
  document.getElementById('lang-btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-btn-bg').classList.toggle('active', lang === 'bg');
  
  // Update static meta texts
  const meta = LOCALES[lang].meta;
  document.getElementById('label-all').innerText = meta.all_traits;
  document.getElementById('label-axes').innerText = lang === 'en' ? 'Biological Axes' : 'Биологични оси';
  document.getElementById('hero-eyebrow').innerText = meta.eyebrow;
  document.getElementById('hero-subtitle').innerText = meta.subtitle;
  document.getElementById('label-stat-total').innerText = meta.traits_label;
  document.getElementById('label-stat-elevated').innerText = meta.elevated_label;
  document.getElementById('label-stat-moderate').innerText = meta.moderate_label;
  document.getElementById('label-stat-favourable').innerText = meta.favourable_label;
  document.getElementById('disclaimer-text').innerHTML = meta.disclaimer;

  document.getElementById('synthesis-body').innerHTML = meta.overview_text;
  document.getElementById('search-box').placeholder = meta.search_placeholder;

  document.getElementById('pill-elev').innerText = meta.elevated_label;
  document.getElementById('pill-mod').innerText = meta.moderate_label;
  document.getElementById('pill-fav').innerText = meta.favourable_label;
  
  document.getElementById('label-pharma-section').innerText = lang === 'en' ? 'Pharmacogenomics & Drug Matches' : 'Фармакогеномика и съвпадения на лекарства';
  document.getElementById('pharma-desc').innerText = lang === 'en' 
    ? 'Potential genetic interactions with medications based on PharmGKB databases.' 
    : 'Потенциални генетични взаимодействия с лекарства въз основа на PharmGKB база данни.';

  // Update navigation labels
  SECTIONS.forEach(sec => {
    const label = document.getElementById(`nav-label-${sec.id}`);
    if (label) label.innerText = sec.names[lang];
  });

  // Re-render components
  renderTraits();
  renderPharmacogenomics();
}

function selectCategory(catId, element) {
  currentCategory = catId;
  
  // Update navigation active states
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => {
    el.classList.remove('active');
  });
  element.classList.add('active');
  
  renderTraits();
}

function filterByRisk(riskType, element) {
  currentRiskFilter = riskType;
  
  if (element) {
    document.querySelectorAll('#risk-filters .filter-pill').forEach(el => {
      el.classList.remove('active');
    });
    element.classList.add('active');
  }
  
  renderTraits();
}

function handleSearch() {
  searchQuery = document.getElementById('search-box').value.toLowerCase();
  renderTraits();
}

function getSeverityColor(prediction) {
  const pred = prediction.toLowerCase();
  if (pred.includes('elevated') || pred.includes('high risk')) return 'var(--accent-red)';
  if (pred.includes('moderate') || pred.includes('moderately')) return 'var(--accent-orange)';
  if (pred.includes('favourable') || pred.includes('below average') || pred.includes('low risk')) return 'var(--accent-green)';
  return 'var(--accent-slate)';
}

function getSeverityLightColor(prediction) {
  const pred = prediction.toLowerCase();
  if (pred.includes('elevated') || pred.includes('high risk')) return 'var(--accent-red-light)';
  if (pred.includes('moderate') || pred.includes('moderately')) return 'var(--accent-orange-light)';
  if (pred.includes('favourable') || pred.includes('below average') || pred.includes('low risk')) return 'var(--accent-green-light)';
  return 'var(--accent-slate-light)';
}

function getLocalizedSeverityText(prediction) {
  if (currentLang === 'en') return prediction;
  const pred = prediction.toLowerCase();
  if (pred.includes('elevated')) return 'ПОВИШЕН';
  if (pred.includes('high risk')) return 'ВИСОК РИСК';
  if (pred.includes('moderate')) return 'УМЕРЕН';
  if (pred.includes('moderately')) return 'УМЕРЕНО';
  if (pred.includes('favourable')) return 'БЛАГОПРИЯТЕН';
  if (pred.includes('below average')) return 'ПОД СРЕДНОТО';
  if (pred.includes('low risk')) return 'НИСЪК РИСК';
  if (pred.includes('mild')) return 'ЛЕК';
  if (pred.includes('average')) return 'СРЕДЕН';
  return prediction;
}

function formatBespokeNarrative(key, r) {
  const traitLocale = LOCALES[currentLang].traits[key];
  
  // If we have a customized bespoke text, return it directly
  if (traitLocale && traitLocale.bespoke) {
    return traitLocale.bespoke;
  }
  
  // Otherwise, handle dynamic category templates (Immune, Cancer, Standard GWAS)
  // Check if Immune
  if (LOCALES[currentLang].immune_themes[key]) {
    const theme = LOCALES[currentLang].immune_themes[key];
    const baseTemplate = LOCALES[currentLang].generic.immune_base;
    return baseTemplate
      .replaceAll('{trait}', traitLocale ? traitLocale.name : key)
      .replaceAll('{gene}', theme.gene)
      .replaceAll('{pathway}', theme.pathway)
      .replaceAll('{elevated}', r.snps_used || 0)
      .replaceAll('{pgs}', (r.pgs_score || 0).toFixed(1))
      .replaceAll('{management}', theme.management);
  }
  
  // Check if Cancer
  if (LOCALES[currentLang].cancer_specifics[key] || LOCALES[currentLang].cancer_specifics[key.replace('_cancer','').replace('cancer_','').title]) {
    const mappingKey = Object.keys(LOCALES[currentLang].cancer_specifics).find(k => key.toLowerCase().includes(k.split(' ')[0].toLowerCase()));
    if (mappingKey) {
      const detail = LOCALES[currentLang].cancer_specifics[mappingKey];
      const baseTemplate = LOCALES[currentLang].generic.cancer_base;
      return baseTemplate
        .replaceAll('{trait}', traitLocale ? traitLocale.name : key)
        .replaceAll('{elevated}', r.snps_used || 0)
        .replaceAll('{pgs}', (r.pgs_score || 0).toFixed(1))
        .replaceAll('{detail}', detail);
    }
  }
  
  // Fallback to standard GWAS summary template
  const baseTemplate = LOCALES[currentLang].generic.gwas_summary_base;
  const pred = getLocalizedSeverityText(r.prediction || 'Average');
  const genes = extractGenes(r.supporting);
  
  return baseTemplate
    .replaceAll('{pred}', pred)
    .replaceAll('{trait}', traitLocale ? traitLocale.name : key)
    .replaceAll('{pgs}', (r.pgs_score || 0).toFixed(1))
    .replaceAll('{elevated}', r.snps_used || 0)
    .replaceAll('{genes}', genes)
    .replaceAll('{narrative}', r.narrative || '');
}

function extractGenes(supportingArray) {
  if (!supportingArray || supportingArray.length === 0) return 'multiple loci';
  const genes = [];
  supportingArray.slice(0, 3).forEach(item => {
    const match = item.match(/-\s*([^)]+)/) || item.match(/\(([^)]+)\)/);
    if (match) {
      const gene = match[1].split('-')[0].trim();
      if (!genes.includes(gene)) genes.push(gene);
    }
  });
  return genes.length > 0 ? genes.join(', ') : 'multiple loci';
}

function renderTraits() {
  const container = document.getElementById('traits-list-container');
  container.innerHTML = '';
  
  // Determine which sections to render
  const sectionsToRender = currentCategory === 'all' 
    ? SECTIONS 
    : SECTIONS.filter(s => s.id === currentCategory);
    
  sectionsToRender.forEach(sec => {
    // Filter keys of this section that exist in SYNTHESIS and match search/filters
    const matchingKeys = sec.keys.filter(key => {
      const r = SYNTHESIS[key];
      if (!r) return false;
      
      const localeTrait = LOCALES[currentLang].traits[key] || { name: key };
      const name = localeTrait.name.toLowerCase();
      const pred = (r.prediction || '').toLowerCase();
      
      // Search filter
      const matchesSearch = searchQuery === '' || 
        name.includes(searchQuery) || 
        pred.includes(searchQuery) ||
        (r.supporting && r.supporting.join(' ').toLowerCase().includes(searchQuery));
        
      // Risk filter
      let matchesRisk = true;
      if (currentRiskFilter === 'elevated') {
        matchesRisk = pred.includes('elevated') || pred.includes('high risk');
      } else if (currentRiskFilter === 'favourable') {
        matchesRisk = pred.includes('favourable') || pred.includes('below average') || pred.includes('low risk');
      } else if (currentRiskFilter === 'moderate') {
        matchesRisk = !pred.includes('elevated') && !pred.includes('high risk') && 
                      !pred.includes('favourable') && !pred.includes('below average') && !pred.includes('low risk');
      }
      
      return matchesSearch && matchesRisk;
    });

    if (matchingKeys.length === 0) return; // Skip section if no matching items

    // Section block container
    const secBlock = document.createElement('section');
    secBlock.className = 'report-section';
    secBlock.id = `sec-${sec.id}`;
    
    secBlock.innerHTML = `
      <h2 class="section-heading">
        <span>${sec.icon}</span>
        <span>${sec.names[currentLang]}</span>
      </h2>
    `;
    
    matchingKeys.forEach(key => {
      const r = SYNTHESIS[key];
      const traitName = LOCALES[currentLang].traits[key] ? LOCALES[currentLang].traits[key].name : r.trait;
      const severityColor = getSeverityColor(r.prediction);
      const severityBg = getSeverityLightColor(r.prediction);
      
      const card = document.createElement('div');
      card.className = 'trait-card';
      card.id = `card-${key}`;
      
      const formattedNarrative = formatBespokeNarrative(key, r);
      
      // Build supporting tags
      const supportingHTML = r.supporting && r.supporting.length > 0
        ? r.supporting.map(s => `<span class="supporting-tag">${s}</span>`).join('')
        : '<span class="supporting-tag">No supporting alleles genotyped</span>';

      card.innerHTML = `
        <div class="severity-bar" style="background: ${severityColor}"></div>
        <div class="trait-card-content">
          <div class="trait-card-header">
            <div class="trait-name-wrap">
              <h3 class="trait-title">${traitName}</h3>
            </div>
            <span class="risk-pill" style="background: ${severityBg}; color: ${severityColor}">
              ${getLocalizedSeverityText(r.prediction || 'Average')}
            </span>
          </div>
          <div class="narrative-container">
            ${formattedNarrative}
          </div>
          <div class="gwas-details">
            <button class="gwas-toggle-btn" onclick="toggleGwas('${key}')">
              📊 ${currentLang === 'en' ? 'View GWAS Technical Details' : 'Преглед на GWAS технически данни'}
            </button>
            <div class="gwas-details-panel" id="gwas-panel-${key}">
              <div class="gwas-stats-grid">
                <div>
                  <div class="gwas-stat-lbl">Polygenic Score (PGS)</div>
                  <div class="gwas-stat-val" style="color: ${r.pgs_score >= 0 ? 'var(--accent-red)' : 'var(--accent-green)'}">
                    ${r.pgs_score >= 0 ? '+' : ''}${(r.pgs_score || 0).toFixed(1)}
                  </div>
                </div>
                <div>
                  <div class="gwas-stat-lbl">Risk Alleles Genotyped</div>
                  <div class="gwas-stat-val">${r.snps_used || 0} loci</div>
                </div>
              </div>
              <div class="gwas-stat-lbl" style="margin-bottom:0.3rem;">Curated / Supporting Alleles</div>
              <div class="gwas-supporting-list">
                ${supportingHTML}
              </div>
            </div>
          </div>
        </div>
      `;
      
      secBlock.appendChild(card);
    });
    
    container.appendChild(secBlock);
  });
  
  if (container.children.length === 0) {
    container.innerHTML = `
      <div style="text-align: center; padding: 4rem 2rem; color: var(--text-muted);">
        <p style="font-size: 1.5rem; font-family: 'EB Garamond', serif; margin-bottom: 0.5rem;">
          ${currentLang === 'en' ? 'No matching traits found' : 'Няма намерени съвпадащи черти'}
        </p>
        <p style="font-size: 0.85rem;">${currentLang === 'en' ? 'Try adjusting your search query or filters' : 'Опитайте да промените критериите за търсене или филтрите'}</p>
      </div>
    `;
  }
}

  if (panel) {
    panel.classList.toggle('expanded');
  }

function renderPharmacogenomics() {

    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 0.85rem;">

  // Group by drug for visual cards
  const drugGroups = {};
  PHARMGKB.forEach(m => {
    const drug = m.drug || 'Unknown';
    if (!drugGroups[drug]) drugGroups[drug] = [];
    drugGroups[drug].push(m);
  });
  
  Object.keys(drugGroups).forEach(drug => {
    const matches = drugGroups[drug];

    card.className = 'pharma-card';
    
    // Group variants details
    let detailsHTML = '';
    matches.forEach(m => {

            <span style="color:var(--text-muted); font-size:0.65rem;">${m.gene || 'Gene'}</span>
          </div>
          <p style="font-size: 0.75rem; line-height:1.4;">${currentLang === 'en' ? (m.evidence_text || 'Interaction linked') : 'Генетично взаимодействие с влияние върху метаболизма.'}</p>
        </div>
      `;
    });
    
    card.innerHTML = `
      <div class="pharma-card-header">
        <div class="pharma-drug-name">${drug}</div>
        <span class="pharma-count-pill">${matches.length} ${currentLang === 'en' ? 'matches' : 'съвпадения'}</span>
      </div>
      <div class="pharma-card-body">
        ${detailsHTML}
      </div>
    `;
    container.appendChild(card);
  });
}
</script>
</body>
</html>
