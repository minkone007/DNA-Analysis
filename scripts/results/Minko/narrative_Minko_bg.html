<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Minko — Personal Genomics Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design System Variables ── */
:root {
  --bg-primary: #fafaf9;
  --bg-secondary: #ffffff;
  --text-primary: #1c1917;
  --text-secondary: #44403c;
  --text-muted: #78716c;
  --border-color: #e7e5e4;
  --accent-blue: #0284c7;
  --accent-blue-light: #e0f2fe;
  --accent-red: #ef4444;
  --accent-red-light: #fee2e2;
  --accent-orange: #f97316;
  --accent-orange-light: #ffedd5;
  --accent-green: #22c55e;
  --accent-green-light: #dcfce7;
  --accent-slate: #64748b;
  --accent-slate-light: #f1f5f9;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  
  --sidebar-w: 280px;
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
}

/* Dark Mode Overrides */
html.dark {
  --bg-primary: #0c0a09;
  --bg-secondary: #1c1917;
  --text-primary: #f5f5f4;
  --text-secondary: #d6d3d1;
  --text-muted: #a8a29e;
  --border-color: #2e2b28;
  --accent-blue-light: #0369a1;
  --accent-red-light: #991b1b;
  --accent-orange-light: #9a3412;
  --accent-green-light: #166534;
  --accent-slate-light: #334155;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
}

/* ── Reset & Global Styles ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  display: flex;
  min-height: 100vh;
  transition: background var(--transition-normal), color var(--transition-normal);
}
a {
  color: inherit;
  text-decoration: none;
}

/* ── Sticky Sidebar ── */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform var(--transition-normal), background var(--transition-normal), border var(--transition-normal);
}
.sidebar-header {
  padding: 1.75rem 1.5rem;
  border-bottom: 1px solid var(--border-color);
}
.sidebar-brand {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.25rem;
}
.sidebar-title {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--text-primary);
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 0.75rem;
}
.nav-section-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 1.25rem 0.5rem 0.5rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0.75rem;
  font-size: 0.85rem;
  font-weight: 500;
  border-radius: 6px;
  margin-bottom: 0.2rem;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  cursor: pointer;
}
.nav-item:hover, .nav-item.active {
  background: var(--bg-primary);
  color: var(--accent-blue);
}
.nav-item.active {
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.sidebar-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.theme-lang-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lang-toggle {
  display: flex;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  overflow: hidden;
  padding: 2px;
}
.lang-btn {
  padding: 0.25rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 700;
  border-radius: 15px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.lang-btn.active {
  background: var(--accent-blue);
  color: #ffffff;
}
.theme-btn {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  padding: 0.4rem;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.theme-btn:hover {
  background: var(--border-color);
}

/* ── Main Layout ── */
.main-wrapper {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Hero Section */
.hero-banner {
  background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
  color: #f8fafc;
  padding: 4rem 3rem;
  position: relative;
  overflow: hidden;
}
.hero-banner::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent-red), var(--accent-orange), var(--accent-green), var(--accent-blue));
}
.hero-eyebrow {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #94a3b8;
  margin-bottom: 0.75rem;
}
.hero-title {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 3rem;
  font-weight: 400;
  line-height: 1.1;
  margin-bottom: 0.5rem;
}
.hero-subtitle {
  font-size: 1.1rem;
  font-style: italic;
  color: #94a3b8;
  margin-bottom: 2.5rem;
}
.hero-stats {
  display: flex;
  gap: 2.5rem;
  flex-wrap: wrap;
}
.stat-item {
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.stat-val {
  font-size: 1.8rem;
  font-weight: 700;
}
.stat-lbl {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #64748b;
}

/* Main Content Area */
.content-container {
  max-width: 1000px;
  width: 100%;
  margin: 0 auto;
  padding: 2.5rem 3rem 5rem;
}
.disclaimer {
  background: rgba(245, 158, 11, 0.08);
  border-left: 4px solid #f59e0b;
  padding: 1rem 1.25rem;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #b45309;
  margin-bottom: 2.5rem;
}
html.dark .disclaimer {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.05);
}

/* ── Search & Filter Controls ── */
.controls-bar {
  position: sticky;
  top: 0;
  background: var(--bg-primary);
  padding: 1rem 0;
  margin-bottom: 2rem;
  z-index: 50;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  gap: 1rem;
  align-items: center;
  flex-wrap: wrap;
}
.search-wrapper {
  flex: 1;
  min-width: 250px;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 0.6rem 1rem 0.6rem 2.25rem;
  font-size: 0.9rem;
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-radius: 20px;
  transition: all var(--transition-fast);
}
.search-input:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}
.search-icon {
  position: absolute;
  left: 0.85rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.9rem;
}
.filter-pills {
  display: flex;
  gap: 0.4rem;
}
.filter-pill {
  padding: 0.4rem 0.85rem;
  font-size: 0.75rem;
  font-weight: 600;
  border-radius: 20px;
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.filter-pill:hover, .filter-pill.active {
  background: var(--text-primary);
  color: var(--bg-primary);
  border-color: var(--text-primary);
}

/* ── Content Sections ── */
.report-section {
  margin-bottom: 4rem;
  scroll-margin-top: 100px;
}
.section-heading {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.8rem;
  font-weight: 500;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Master Synthesis Block */
.synthesis-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-md);
  border-radius: 8px;
  padding: 2.25rem;
  margin-bottom: 3.5rem;
}
.synthesis-card h2 {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.6rem;
  margin-bottom: 1rem;
}
.synthesis-card p {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.15rem;
  line-height: 1.75;
  color: var(--text-secondary);
  margin-bottom: 1.25rem;
}
.synthesis-card ul, .synthesis-card ol {
  margin: 0.5rem 0 1.25rem 1.5rem;
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.15rem;
  color: var(--text-secondary);
}
.synthesis-card li {
  margin-bottom: 0.5rem;
  line-height: 1.6;
}
.synthesis-card strong {
  color: var(--text-primary);
}

/* ── Trait Block Cards ── */
.trait-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 1.5rem;
  overflow: hidden;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast), border var(--transition-fast);
  display: flex;
}
.trait-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.severity-bar {
  width: 6px;
  flex-shrink: 0;
}
.trait-card-content {
  flex: 1;
  padding: 1.5rem;
  min-width: 0;
}
.trait-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 1rem;
}
.trait-name-wrap {
  min-width: 0;
}
.trait-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 0.15rem;
}
.risk-pill {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.25rem 0.65rem;
  border-radius: 12px;
  display: inline-block;
}

/* Narrative Prose Styles */
.narrative-container {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.12rem;
  line-height: 1.75;
  color: var(--text-secondary);
}
.narrative-container p {
  margin-bottom: 0.85rem;
}
.narrative-container p:last-child {
  margin-bottom: 0;
}
.narrative-container ul, .narrative-container ol {
  margin: 0.5rem 0 0.85rem 1.5rem;
  line-height: 1.6;
}
.narrative-container li {
  margin-bottom: 0.35rem;
}
.narrative-container strong {
  color: var(--text-primary);
  font-weight: 600;
}

/* GWAS Accordion Sub-Panel */
.gwas-details {
  border-top: 1px solid var(--border-color);
  margin-top: 1rem;
  padding-top: 1rem;
}
.gwas-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent-blue);
  background: transparent;
  border: none;
  cursor: pointer;
  margin-top: 0.75rem;
}
.gwas-toggle-btn:hover {
  text-decoration: underline;
}
.gwas-details-panel {
  display: none;
  padding-top: 1rem;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
.gwas-details-panel.expanded {
  display: block;
  animation: slideDown var(--transition-fast);
}
.gwas-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
  background: var(--bg-primary);
  padding: 0.85rem;
  border-radius: 6px;
  border: 1px solid var(--border-color);
}
.gwas-stat-lbl {
  font-weight: 600;
  font-size: 0.7rem;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.1rem;
}
.gwas-stat-val {
  font-family: monospace;
  font-size: 0.9rem;
  font-weight: 600;
}
.gwas-supporting-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.supporting-tag {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  font-size: 0.72rem;
  font-family: monospace;
}

/* Dynamic Section Divider Blocks */
.backend-narrative-block {
  background: var(--bg-primary);
  border-left: 3px solid var(--accent-blue);
  padding: 1rem;
  margin-bottom: 1rem;
  border-radius: 0 4px 4px 0;
}
.backend-block-title {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--accent-blue);
  margin-bottom: 0.35rem;
}

/* ── Pharmacogenomics Grid ── */
.pharma-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
  margin-top: 1.5rem;
}
.pharma-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  transition: all var(--transition-fast);
}
.pharma-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.pharma-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.5rem;
  margin-bottom: 0.75rem;
}
.pharma-drug-name {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
}
.pharma-count-pill {
  background: var(--accent-blue-light);
  color: var(--accent-blue);
  font-size: 0.65rem;
  font-weight: 700;
  padding: 0.15rem 0.45rem;
  border-radius: 10px;
}
html.dark .pharma-count-pill {
  background: rgba(2, 132, 199, 0.2);
}
.pharma-card-body {
  flex: 1;
  font-size: 0.82rem;
  color: var(--text-secondary);
}
.pharma-card-body p {
  margin-bottom: 0.5rem;
}
.pharma-card-body strong {
  color: var(--text-primary);
}

/* ── Animations ── */
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-5px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ── Mobile & Responsive design ── */
.mobile-header {
  display: none;
  background: #0f172a;
  color: #ffffff;
  padding: 1rem 1.5rem;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 1000;
}
.menu-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
}

@media (max-width: 900px) {
  body {
    flex-direction: column;
  }
  .sidebar {
    transform: translateX(-100%);
    top: 60px;
    height: calc(100vh - 60px);
    width: 100%;
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .main-wrapper {
    margin-left: 0;
  }
  .mobile-header {
    display: flex;
  }
  .hero-banner {
    padding: 3rem 1.5rem;
  }
  .hero-title {
    font-size: 2.2rem;
  }
  .content-container {
    padding: 1.5rem 1rem;
  }
}
</style>
</head>
<body>

<div class="mobile-header">
  <div style="font-family:'EB Garamond',serif; font-size:1.2rem; font-weight:600;">Personal Genomics</div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">Personal Genomics</div>
    <div class="sidebar-title">Minko</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" onclick="selectCategory('all', this)">
      <span>🌐</span> <span id="label-all">All Categories</span>
    </div>
    <div class="nav-section-label" id="label-axes">Biological Axes</div>
    <div id="axes-list"></div>
  </nav>
  <div class="sidebar-footer">
    <div class="theme-lang-bar">
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
      <div class="lang-toggle">
        <button class="lang-btn active" id="lang-btn-en" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn" id="lang-btn-bg" onclick="switchLanguage('bg')">БГ</button>
      </div>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <div class="hero-banner">
    <p class="hero-eyebrow" id="hero-eyebrow">Personal Genomics Report</p>
    <h1 class="hero-title">Minko</h1>
    <p class="hero-subtitle" id="hero-subtitle">Genetic Health Narrative</p>
    <div class="hero-stats">
      <div class="stat-item" onclick="filterByRisk('all')">
        <span class="stat-val" id="stat-total">0</span>
        <span class="stat-lbl" id="label-stat-total">Traits Analysed</span>
      </div>
      <div class="stat-item" onclick="filterByRisk('elevated')">
        <span class="stat-val" style="color:var(--accent-red)" id="stat-elevated">0</span>
        <span class="stat-lbl" id="label-stat-elevated">Elevated</span>
      </div>
      <div class="stat-item" onclick="filterByRisk('moderate')">
        <span class="stat-val" style="color:var(--accent-orange)" id="stat-moderate">0</span>
        <span class="stat-lbl" id="label-stat-moderate">Moderate</span>
      </div>
      <div class="stat-item" onclick="filterByRisk('favourable')">
        <span class="stat-val" style="color:var(--accent-green)" id="stat-favourable">0</span>
        <span class="stat-lbl" id="label-stat-favourable">Favourable</span>
      </div>
    </div>
  </div>

  <div class="content-container">
    <div class="disclaimer" id="disclaimer-text"></div>
    
    <div class="synthesis-card">
      <h2 id="synthesis-title">Your Genetic Story — The Big Picture</h2>
      <div id="synthesis-body"></div>
    </div>

    <div class="controls-bar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-box" oninput="handleSearch()" placeholder="Search traits, genes, or risk levels...">
      </div>
      <div class="filter-pills" id="risk-filters">
        <button class="filter-pill active" onclick="filterByRisk('all', this)" id="pill-all">All</button>
        <button class="filter-pill" onclick="filterByRisk('elevated', this)" style="border-left: 3px solid var(--accent-red)" id="pill-elev">Elevated</button>
        <button class="filter-pill" onclick="filterByRisk('moderate', this)" style="border-left: 3px solid var(--accent-orange)" id="pill-mod">Moderate</button>
        <button class="filter-pill" onclick="filterByRisk('favourable', this)" style="border-left: 3px solid var(--accent-green)" id="pill-fav">Favourable</button>
      </div>
    </div>

    <div id="traits-list-container" style="animation: fadeIn var(--transition-normal);"></div>
    
    <div class="report-section" id="sec-pharma" style="margin-top: 5rem;">
      <h2 class="section-heading">🏃 <span id="label-pharma-section">Pharmacogenomics & Drug Matches</span></h2>
      <p class="narrative-container" id="pharma-desc" style="margin-bottom:1.5rem;"></p>
      <div class="pharma-grid" id="pharma-cards-container"></div>
    </div>
  </div>
</div>

<script>
// Data injected by python backend
const LOCALES = {"en": {"meta": {"title_suffix": "— Genetic Health Narrative", "eyebrow": "Personal Genomics Report", "subtitle": "Genetic Health Narrative", "contents": "Contents", "traits_label": "Traits Analysed", "elevated_label": "Elevated", "favourable_label": "Favourable", "moderate_label": "Moderate", "generated_label": "Generated", "disclaimer": "<strong>Important:</strong> This report is for personal educational purposes only — not a medical diagnosis. Genetic predisposition does not determine health outcomes. Please discuss any findings of concern with a qualified healthcare professional.", "search_placeholder": "Search traits, genes, or risk levels...", "dark_mode_toggle": "Toggle Dark/Light Mode", "all_traits": "All Categories", "overview_title": "Your Genetic Story — The Big Picture", "overview_text": "<p>After looking at your complete genetic profile, a coherent story emerges. You do not have any dramatic single-gene disorders, but you do have moderate genetic loading across several interconnected systems. The pattern is clear:</p><ul><li><strong>Cardiometabolic system</strong> — moderate tendency toward higher lipids, blood pressure sensitivity, and metabolic efficiency challenges.</li><li><strong>Immune & inflammatory regulation</strong> — consistent elevation across multiple autoimmune and inflammatory conditions.</li><li><strong>Brain & cognitive health</strong> — signals in mood regulation, neurodegeneration risk, and cognitive performance under stress.</li></ul><p>The common biological theme running through your profile is <strong>inflammation and metabolic resilience</strong>. Your body appears to run a bit \"hot\" in inflammatory pathways and is less efficient at certain protective and repair processes. This is not uncommon, and importantly, it is highly modifiable through lifestyle.</p><p><strong>The highest-leverage areas for you are:</strong></p><ol><li><strong>Consistent physical activity</strong> — especially aerobic + resistance training. This positively influences all three major systems (cardiometabolic, immune, and cognitive).</li><li><strong>Anti-inflammatory nutrition</strong> — Mediterranean-style eating, high omega-3 intake, adequate Vitamin D, and magnesium.</li><li><strong>Sleep and stress management</strong> — critical for immune regulation and cognitive health.</li></ol><p>Your genetics also give you clear advantages in other areas (height, intelligence, some protective variants). The overall picture is not one of inevitable disease, but of specific vulnerabilities that respond well to targeted lifestyle intervention.</p><p>This is your map. The terrain is known. What you do with it is up to you.</p>", "gwas_summary_header": "GWAS Summary", "deeper_analysis_header": "Deeper Analysis"}, "traits": {"eye_color": {"name": "Eye Color", "bespoke": "<p>Your eye colour prediction sits at the blue-green boundary, which is exactly where your genotype combination places you. The dominant signal is rs12913832 GG — this single variant in the HERC2 gene is the strongest known predictor of eye colour in humans, and GG is the classic blue-associated genotype found in roughly 97% of blue-eyed Europeans. On its own, this would predict blue.</p><p>What introduces the green element is the combination of secondary signals pulling in different directions. SLC24A4 GT and IRF4 CT are both intermediate — they neither fully reinforce the blue signal nor push toward brown. SLC45A2 GG is the ancestral allele, which doesn't contribute the European lightening variant, adding a small counterweight. TYR AG (heterozygous) reduces melanin synthesis modestly across all tissues including the iris.</p><p>The net result: a strongly reduced OCA2-driven melanin signal from HERC2, partially modulated by intermediate alleles at supporting loci. This produces a lighter-than-brown iris with the specific hue sitting somewhere between blue and green depending on lighting conditions and iris structure. Blue-green or green-blue are both plausible phenotypic outcomes. Brown is effectively ruled out — you carry none of the classic brown-promoting allele combinations at the key loci.</p><p>One practical note: TYR CA's melanin-reducing effect extends beyond eye colour. The same enzyme reduction that lightens the iris also reduces UV-protective eumelanin in skin. This is not merely a cosmetic footnote — it has genuine implications for sun damage accumulation over a lifetime, addressed further in the skin section.</p>"}, "hair_color": {"name": "Hair Color", "bespoke": "<p>Your hair colour genetics tell a clean, consistent story: medium to dark brown, with no red component. The MC1R gene — which functions as the primary switch between red/yellow pheomelanin and dark eumelanin — shows no risk variants across all four tested positions (Arg151Cys, Arg160Trp, Arg163Gln, Cys289Arg). This effectively rules out red hair entirely. You inherited a fully functional MC1R receptor, which means your melanocytes default to eumelanin production.</p><p>The dominant pigmentation signal is SLC45A2 GG. This is the ancestral allele — common in non-European and darker-pigmented populations — which does not contribute the European hair-lightening variant. Combined with the absence of MC1R variants, this firmly establishes a dark baseline.</p><p>The only modest lightening signal comes from TYR AC (heterozygous at rs1042602), which reduces tyrosinase enzyme efficiency. This is a moderate effect — it may contribute some softening of the darkest possible hue, which is why the prediction is medium-to-dark rather than jet black. SLC24A4 GT is intermediate and adds no meaningful lightening.</p><p>The overall picture: dark brown hair driven by intact eumelanin machinery, with a modest TYR-mediated reduction that prevents the very darkest end of the spectrum. Environmental factors (sun exposure causing pheomelanin accumulation, ageing) will modify this over time, but the genetic baseline is clearly dark.</p>"}, "skin_tone": {"name": "Skin Tone", "bespoke": "<p>Your skin pigmentation genetics reveal an interesting tension between two opposing forces, which produces a medium rather than extreme result in either direction.</p><p>The lightening signal is substantial: SLC24A5 AA is the derived European allele at the single most influential skin colour locus known. This variant spread through European and South Asian populations roughly 8,000 years ago, likely as an adaptation to low-UV environments requiring efficient vitamin D synthesis. Its effect size is large enough that it alone explains a significant fraction of the pigmentation difference between European and West African populations.</p><p>Counterbalancing this is SLC45A2 GG — the ancestral allele at a second major pigmentation gene. Unlike the CC European variant at SLC45A2, GG does not contribute additional lightening. This creates a genuine partial offset: SLC24A5 pushes strongly toward lighter skin; SLC45A2 holds back from adding further lightening, producing a light-to-medium rather than very fair result.</p><p>TYR CA (heterozygous) adds a third layer: reduced tyrosinase activity means less eumelanin output across all skin cells. This contributes to freckling tendency and, critically, to reduced UV protection. The skin's tanning response depends on tyrosinase upregulation in response to UV — with one reduced-function TYR allele, this response is blunted. The practical consequence: your skin burns more readily than it tans, and UV damage accumulates faster than in someone with full tyrosinase activity. SPF50 is not overcautious for this profile — it is the appropriate baseline, used consistently rather than occasionally.</p><p>The Fitzpatrick Type III prediction (medium skin, tans after initial burn) fits this genotype combination accurately.</p>"}, "hair_loss": {"name": "Hair Loss", "bespoke": "<p>Your hair loss genetics tell a reassuring story. The X-linked AR/EDA2R locus — the single strongest signal for male pattern baldness, with ORs above 2.0 in published GWAS — shows rs2497938 CC, which is the non-risk genotype. This locus is inherited maternally (on the X chromosome), meaning the signal you carry from your mother's side does not confer the classic androgenetic alopecia predisposition at this dominant position.</p><p>The GWAS confirms this: only 1 elevated locus out of 15 genotyped, with a PGS of +2.8 — the lowest meaningful polygenic score in your entire profile. Male pattern baldness is approximately 80% heritable, making this one of the most genetically determined traits in the report. The low genetic signal here is therefore genuinely informative rather than a data gap.</p><p>AR receptor sensitivity and DHT conversion rates have additional genetic determinants (5-alpha reductase, androgen receptor CAG repeat length) that were not captured on your chip, so a small residual uncertainty remains. But the primary signal is clear and favourable.</p>"}, "height": {"name": "Height", "bespoke": "<p>Height is one of the most polygenic traits in the human genome — thousands of variants each contributing fractions of a millimetre. Your polygenic score of +401 from 29 elevated loci is the second-highest quantitative score in your profile (after intelligence), and it consistently points above the population mean.</p><p>HMGA2 rs1042725 TT is the one well-characterised curated locus on your chip. HMGA2 (High Mobility Group AT-hook 2) is a transcription factor that regulates growth and development — TT at this position is the taller-associated genotype, contributing approximately 0.4 cm per allele in large-scale studies.</p><p>The GWAS elevated loci include hits across pathways governing bone growth, IGF-1 signalling, and skeletal development. A PGS of +401 in the height GWAS (which uses beta coefficients in cm units) translates to a meaningful cumulative signal toward above-average stature. Height is approximately 80% heritable in well-nourished populations, and your genetic signal is consistent with above-average genetic potential for height — though actual realised height depends substantially on childhood nutrition, sleep, and health.</p>"}, "cholesterol": {"name": "Cholesterol / LDL", "bespoke": "<p>Your cholesterol genetics present a mixed but ultimately moderate picture. The most important finding is what is absent: you carry rs7412 CC, which is the APOE ε2 signal — associated with lower LDL and reduced cardiovascular risk compared to the common ε3/ε3 genotype. This is a genuinely favourable finding at the most clinically significant cholesterol locus.</p><p>The note of caution is that rs429358 — the second SNP needed to fully call APOE genotype — was not on your chip. This means we cannot rule out a mixed ε2/ε4 genotype, which would partially offset the ε2 protection. A clinical APOE genotype test (inexpensive, available through your GP) would resolve this definitively and is worth doing given its implications for both cardiovascular and Alzheimer risk.</p><p>Beyond APOE, the LDL-relevant variants show: rs629301 TT at SORT1/CELSR2 carries two copies of the LDL-raising allele — this locus modestly elevates LDL through effects on hepatic SORT1 expression and LDL receptor trafficking. rs11591147 GG at PCSK9 shows no protective loss-of-function allele, meaning you don't have the natural PCSK9 inhibition that some individuals carry (which can lower LDL by 30% without medication). LPA rs10455872 AA is non-risk — you do not carry the Lp(a)-elevating variant, which is a meaningful protective finding since elevated Lp(a) is an independent cardiovascular risk factor not captured by standard lipid panels.</p><p>Overall: the SORT1 variant creates a modest LDL-raising tendency that is likely counterbalanced somewhat by the APOE ε2 signal. Diet and exercise remain the first-line approach. Annual lipid panels are appropriate, and resolving the full APOE status would meaningfully sharpen this picture.</p>"}, "triglycerides": {"name": "Triglycerides", "bespoke": "<p>Your triglyceride genetics show a pattern of moderate elevation with one important protective counterweight. The primary risk signal is APOA5 AG (rs662799 heterozygous) — APOA5 is the dominant triglyceride locus, and the G allele impairs APOA5's role in activating lipoprotein lipase, leading to slower triglyceride clearance. Heterozygous carriers typically show mild-to-moderate triglyceride elevation, with the effect amplified substantially by carbohydrate intake and alcohol.</p><p>APOC3 AG (rs2266788) adds a secondary signal — APOC3 normally inhibits LPL, and the promoter variant increases APOC3 expression, further reducing triglyceride clearance. MTNR1B CG (heterozygous) affects fasting triglycerides via melatonin receptor signalling — a more modest contribution.</p><p>The key protective finding is LPL rs328 CC — the S447X gain-of-function variant. This is genuinely protective: the C allele creates a truncated but hyperactive form of lipoprotein lipase that substantially improves triglyceride clearance. This is one of the few cases in lipid genetics where a variant provides real biological protection, and its presence meaningfully counterbalances the APOA5 and APOC3 risk signals.</p><p>Dietary implications are direct: your APOA5 heterozygosity means carbohydrate and alcohol intake have an amplified effect on your triglyceride levels compared to someone without this variant. Omega-3 supplementation (EPA/DHA, 2-4g daily) is particularly effective in APOA5 risk carriers — clinical trials show 20-30% triglyceride reduction. Low-carbohydrate diets are more effective for you than for the average person. The LPL protective allele means you have better baseline clearance capacity than your risk alleles alone would suggest.</p>"}, "cad": {"name": "Coronary Artery Disease", "bespoke": "<p>Coronary artery disease is where your genetic profile shows its most clinically significant elevation. The 9p21 locus (CDKN2B-AS1) — the single most replicated common CAD variant in the literature — appears twice in your data: rs4977574 AG (one risk copy) and rs1333049 CG (one risk copy at the secondary variant). These two variants are additive and their effects are well-established across multiple large cohort studies.</p><p>What makes the 9p21 locus particularly important is that it acts independently of LDL cholesterol. Its mechanism involves regulation of cell proliferation in vascular smooth muscle and inflammatory pathways — meaning standard lipid testing will not capture this risk. Someone with normal cholesterol and 9p21 risk alleles still has meaningfully elevated CAD risk compared to population baseline.</p><p>Additional signals: rs646776 TT at CELSR2/SORT1 (the same locus relevant to LDL) carries two copies of the risk allele and contributes via the LDL pathway. rs1122608 GG at LDLR is the LDL receptor region variant. The LPL rs264 GG is the protective allele — a gain-of-function variant that raises lipoprotein lipase activity and improves triglyceride clearance. This partial offset from LPL is a genuine counterbalancing factor.</p><p>The GWAS shows 25 elevated loci and a PGS of +111, confirming meaningful polygenic loading across multiple CAD pathways. Given this profile, attention to the full cardiovascular risk picture is warranted: blood pressure monitoring, regular lipid panels (with awareness that 9p21 risk is not captured by LDL alone), smoking avoidance, and physical activity. High-sensitivity CRP (hsCRP) testing is worth discussing with your GP as an inflammatory risk marker relevant to the 9p21 pathway.</p>"}, "heart_failure": {"name": "Heart Failure", "bespoke": "<p>Your heart failure genetic profile highlights a subtle loading, primarily involving pathways related to myocardial stress response and sarcomeric integrity. Genes such as <strong>BAG3</strong> (rs2234962) and <strong>ALPK2</strong> are prominent in GWAS research on idiopathic dilated cardiomyopathy. While these variants do not indicate structural heart defects, they suggest that under conditions of prolonged mechanical stress or hypertension, your cardiac myocytes may have a slightly reduced threshold for strain.</p><p>Protective actions are highly effective: regular cardiovascular conditioning (specifically zone 2 aerobic training) promotes ventricular compliance and myocardial capillary density, while maintaining optimal systemic blood pressure directly reduces the cardiac afterload, protecting the cardiac muscle from maladaptive hypertrophy. Avoiding cardiotoxic exposures (such as excessive alcohol) is highly recommended for this profile.</p>"}, "atrial_fibrillation": {"name": "Atrial Fibrillation", "bespoke": "<p>Atrial fibrillation genetic scores focus heavily on transcription factors regulating cardiac electrical conduction and atrial development. The key loci identified in GWAS include <strong>PITX2</strong> (rs10033464) and <strong>ZFHX3</strong>. Variants here alter the development of the pulmonary vein sleeves—the critical area where ectopic electrical beats frequently trigger atrial fibrillation.</p><p>Even without clinical symptoms, individuals with these variants can be highly sensitive to stimulants that cause transient sympathetic surges. Practical advice: moderate or eliminate known triggers such as excessive caffeine, acute alcohol consumption (which can trigger Holiday Heart Syndrome), and chronic sleep deprivation. Regular endurance athletes with this profile should also ensure proper electrolyte balance (magnesium and potassium) to stabilize atrial electrical activity.</p>"}, "stroke": {"name": "Stroke", "bespoke": "<p>Your genetic predisposition to stroke shows moderate polygenic loading, which is best understood by splitting stroke into its primary sub-types: ischemic (arterial blockage) and hemorrhagic (bleeding). Variants near <strong>HDAC9</strong> (rs2107595) are strongly linked to large-artery atherosclerotic stroke, affecting systemic arterial calcification and endothelial stability.</p><p>Because stroke risk is heavily mediated by vascular health, managing blood pressure and keeping arterial inflammation low are the single most powerful preventative levers. Annual carotid ultrasounds starting in middle age, combined with an anti-inflammatory diet rich in antioxidants, support endothelial resilience. Keeping homocyteine levels managed (strongly relevant to your MTHFR profile) is also critical to prevent microvascular damage.</p>"}, "blood_pressure": {"name": "Blood Pressure", "bespoke": "<p>Essential hypertension is a highly polygenic trait, but key regulatory pathways include renal sodium handling (epithelial sodium channels) and vascular reactivity. Variants at the <strong>AGT</strong> (angiotensinogen) and <strong>ADD1</strong> (adducin 1) loci suggest a profile that is sensitive to dietary sodium-to-potassium ratios.</p><p>Under a high-sodium, low-potassium diet, your kidneys may retain water more aggressively, expanding blood volume and increasing systemic vascular resistance. Actionable guidelines: prioritize a potassium-rich diet (avocados, leafy greens, coconut water) and limit refined sodium, while incorporating regular aerobic exercise to keep blood vessels elastic and responsive. Regular checking of home blood pressure is a simple, high-value habit.</p>"}, "t2d": {"name": "Type 2 Diabetes", "bespoke": "<p>Your Type 2 diabetes genetic profile deserves a careful reading because the headline number — elevated risk — obscures an important pattern in the detail.</p><p>You are heterozygous at almost every major T2D locus. TCF7L2 CT (one risk copy), KCNJ11 CT (one risk copy), SLC30A8 TC (one risk copy), CDKN2A/B CT (one risk copy), HHEX TC (one risk copy), IGF2BP2 GT (one risk copy), FTO CA (one risk copy). This consistent heterozygosity across seven independent loci is the defining feature of your profile. It means you have accumulated moderate genetic loading broadly, rather than severe loading at any single gene.</p><p>The three homozygous risk hits (rs76895963 TT, rs10741243 GG, rs1631619 GG) strengthen the signal, but rs1631619 GG deserves special mention: its OR of 5.0 comes from a Korean cohort study. Population-specific effect sizes frequently do not replicate at full magnitude in other ancestries, and this variant should be interpreted with that caveat in mind.</p><p>TCF7L2 is the most important finding here. It is the strongest and most widely replicated common T2D variant, operating through the Wnt signalling pathway to impair beta-cell function. Heterozygous carriers have approximately 1.4x baseline risk. Crucially, TCF7L2 risk carriers respond particularly well to lifestyle intervention — the Diabetes Prevention Program trial showed that carriers who underwent lifestyle modification had the same T2D incidence reduction as non-carriers, meaning the genetic effect is not fixed.</p><p>The practical message: your genetic profile warrants attention to modifiable risk factors — weight, physical activity, dietary glycaemic load — but the predominantly heterozygous pattern means lifestyle intervention is genuinely effective at this level of loading. Fasting glucose and HbA1c monitoring every few years is appropriate regardless of symptoms.</p>"}, "bmi": {"name": "BMI / Obesity Tendency", "bespoke": "<p>Your BMI genetics show moderate loading, with the key finding being FTO heterozygosity. rs9939609 AT means you carry one copy of the FTO risk allele (A) — each A allele adds approximately 0.4 kg/m² to average BMI, putting you at modest rather than strong genetic BMI elevation. The secondary FTO variant rs17817449 GT adds a small additional signal.</p><p>A critically important counterbalance: rs2815752 AG at NEGR1 carries the protective allele (A) in heterozygous form. NEGR1 is involved in neuronal growth and appetite regulation — the protective variant is associated with lower BMI, and its presence here partially offsets the FTO signal.</p><p>The most important thing to know about your FTO genotype is what the research shows about modifiability. The Kilpeläinen et al. 2011 meta-analysis (PLOS Medicine, 218,000 participants) demonstrated that FTO risk allele carriers who were physically active had BMI values essentially identical to non-carriers. The genetic effect of FTO on BMI was almost completely abolished by regular physical activity. This is one of the clearest gene-environment interaction findings in all of genomics — and it is directly actionable. The genetic tendency exists; whether it expresses depends substantially on activity level.</p>"}, "gout": {"name": "Gout", "bespoke": "<p>Gout is a form of inflammatory arthritis driven by the crystallization of monosodium urate in the joints, and its genetics are dominated by renal transport proteins. The <strong>SLC2A9</strong> and <strong>ABCG2</strong> genes encode transporters responsible for reabsorbing or secreting urate in the kidney proximal tubules.</p><p>Risk variants here lead to less efficient uric acid excretion, causing serum urate levels to climb. Because this pathway is highly sensitive to metabolic inputs, dietary choices are major modulators. Fructose (which accelerates ATP depletion and purine synthesis) and alcohol (which competes with uric acid for renal excretion) have an amplified impact. Hydration, limiting high-purine foods, and maintaining overall insulin sensitivity are direct preventative tools.</p>"}, "chronic_kidney_disease": {"name": "Chronic Kidney Disease", "bespoke": "<p>Your renal genetic profile reveals variants at the <strong>UMOD</strong> (uromodulin) and <strong>SHROOM3</strong> loci, which are associated with long-term glomerular filtration rate (eGFR) decline. UMOD variants can affect the secretion of uromodulin in the thick ascending limb of Henle, influencing local inflammatory responses and susceptibility to interstitial fibrosis.</p><p>This is not a prediction of kidney failure, but rather an indicator of reduced renal reserve. To protect kidney function over your lifetime, avoid chronic use of NSAIDs (like ibuprofen), maintain tight blood pressure and blood glucose control, and ensure consistent hydration to reduce physical shear stress on the nephrons.</p>"}, "vitamin_d": {"name": "Vitamin D Levels", "bespoke": "<p>Your Vitamin D genetics show a nuanced picture that goes beyond the \"mild\" polygenic label. While the overall GWAS score is only modestly elevated (+11.4), your specific variants reveal inefficiencies at two critical stages: transport and cellular uptake.</p><p><strong>Transport stage (GC gene):</strong> You carry rs7041 CA (heterozygous) and rs4588 GG. This combination produces a mix of Vitamin D Binding Proteins, resulting in moderately reduced efficiency in delivering Vitamin D to your tissues. It is not severely impaired, but it lowers the amount of bioavailable Vitamin D compared to individuals with optimal GC genotypes.</p><p><strong>Receptor stage (VDR gene):</strong> More significant are your VDR variants — rs731236 AA (TaqI) and rs7975232 CC (ApaI). These are well-studied markers associated with reduced Vitamin D receptor sensitivity. This means that even when Vitamin D reaches your cells, the receptors that should trigger calcium absorption and bone mineralization respond less effectively.</p><p>The combined effect creates a two-stage \"volume reduction\" on Vitamin D activity. You are not unable to process Vitamin D, but you have a higher physiological requirement to achieve the same level of calcium absorption and bone mineralization as someone with more efficient genetics. This aligns with your earlier observation about reduced calcium storage capacity in bones.</p><p><strong>Practical implications:</strong> Aim to maintain higher serum Vitamin D levels (ideally 50–70 ng/mL). Because this is partly a receptor sensitivity issue, optimizing cofactors is crucial:</p><ul><li><strong>Magnesium</strong> (300–400 mg/day) — required for Vitamin D activation.</li><li><strong>Vitamin K2 (MK-7)</strong> (100–200 mcg/day) — directs calcium into bones rather than soft tissues.</li></ul><p>Regular blood testing (25(OH)D, calcium, PTH) is recommended to fine-tune your levels.</p>"}, "mthfr": {"name": "MTHFR / B-Vitamin Metabolism", "bespoke": "<p>Your folate and B-vitamin metabolism genetics are the most clinically actionable nutritional finding in this report, and they deserve careful attention because they were missing from the main health report entirely.</p><p>You carry two MTHFR variants simultaneously — compound heterozygosity that is more significant than either variant alone:</p><p><strong>MTHFR C677T (rs1801133) GA — heterozygous.</strong> The T allele reduces MTHFR enzyme activity by approximately 35% in heterozygotes. MTHFR (methylenetetrahydrofolate reductase) is the key enzyme that converts folate into the active form (5-methylTHF) used to recycle homocysteine back to methionine. Reduced activity means slower homocysteine clearance and potentially elevated plasma homocysteine — a cardiovascular and neurological risk factor.</p><p><strong>MTHFR A1298C (rs1801131) GT — heterozygous.</strong> The C allele at this position reduces MTHFR activity through a different mechanism, affecting the regulatory domain of the enzyme. Alone, A1298C heterozygosity has modest effects. Combined with C677T heterozygosity (compound heterozygosity), the functional enzyme activity can be reduced by 50-60% — approaching the level seen in C677T homozygotes.</p><p><strong>MTR A2756G (rs1805087) AA</strong> — this is the wild-type at the methionine synthase gene, meaning no additional impairment of the B12-dependent remethylation pathway from this locus.</p><p><strong>MTRR A66G (rs1801394) GG</strong> — this is the AA wild-type at methionine synthase reductase (the enzyme that recycles the B12 cofactor for MTR). GG here means no MTRR-related impairment.</p><p><strong>MTHFD1 (rs2236225) AG</strong> — heterozygous at the methylenetetrahydrofolate dehydrogenase gene, which feeds into the folate cycle. This adds a modest additional strain on the overall one-carbon metabolism pathway.</p><p>The practical implications of compound MTHFR heterozygosity are direct and well-supported by clinical evidence:</p><p>First, standard folic acid (the synthetic form in most supplements) requires conversion to active 5-methylTHF by MTHFR itself — a step that is inefficient in your case. The solution is to supplement with <strong>methylfolate (5-MTHF)</strong> directly, bypassing the impaired conversion step entirely. 400-800 mcg of methylfolate daily is the standard recommendation for MTHFR compound heterozygotes.</p><p>Second, B12 status matters more for you than for the average person. The homocysteine-to-methionine conversion requires both active folate and B12 as cofactors. Methylcobalamin (the active form of B12) rather than cyanocobalamin is preferable for the same bypass reasoning. Testing homocysteine, folate, and B12 blood levels is worth doing to establish your actual metabolic status — genetics tell you the predisposition, blood tests tell you whether it is expressing.</p><p>Third, the cardiovascular relevance: elevated homocysteine is an independent risk factor for coronary artery disease and stroke — two areas where your GWAS data already shows elevated signals. This is not coincidental; the MTHFR-homocysteine-cardiovascular connection is well-established and represents a direct intervention opportunity. Adequate methylfolate and methylcobalamin supplementation has been shown to normalise homocysteine in MTHFR carriers.</p><p>This is one area where a relatively simple nutritional intervention (switching supplement forms) has genuine mechanistic rationale specific to your genotype.</p>"}, "intelligence": {"name": "Cognitive Profile", "bespoke": "<p>Your cognitive genetics contain the highest polygenic score in this entire report: PGS +1064 from 8 elevated loci in the intelligence GWAS. Before interpreting this, the important methodological context: intelligence GWAS studies frequently include educational attainment as a proxy phenotype, and many hits reflect pleiotropic variants that affect both educational achievement and Alzheimer's risk via shared biological pathways. The PGS score therefore reflects a mixture of cognitive ability, educational propensity, and neurological resilience signals — not a pure intelligence measure.</p><p>The curated SNPs provide the most interpretable layer. COMT rs4680 GG is the Val/Val (Warrior) genotype — higher COMT enzymatic activity means faster dopamine breakdown in the prefrontal cortex. This produces better working memory performance and executive function under high cognitive load and stress, at the cost of slightly lower baseline dopamine tone and potentially reduced exploratory behaviour. Critically, Val/Val carriers show superior cognitive performance specifically under pressure and in complex task-switching — the profile associated with performance in demanding professional environments.</p><p>BDNF rs6265 CT (Val66Met heterozygous) is the one nuancing factor. The Met allele reduces activity-dependent BDNF secretion, which affects synaptic plasticity and learning consolidation. However, heterozygosity means one functional Val allele remains — this is a partial rather than full reduction. In practice, Val66Met heterozygotes show modestly reduced episodic memory performance in some studies but maintain normal working memory.</p><p>The combination — COMT Warrior profile with heterozygous BDNF — suggests a cognitive profile that excels under cognitive demand and structured tasks, while being somewhat more dependent than average on sleep quality and aerobic exercise for optimal memory consolidation. BDNF is one of the most exercise-responsive genes known: regular aerobic exercise upregulates BDNF expression and substantially compensates for the Met allele's reduced baseline secretion.</p>"}, "alzheimer": {"name": "Alzheimer's Disease", "bespoke": "<p>Your Alzheimer's risk profile contains arguably the most reassuring finding in this entire report. rs7412 CC corresponds to the APOE ε2 allele — and APOE ε2 is the strongest known protective variant against late-onset Alzheimer's disease. ε2 carriers have approximately 50% lower Alzheimer's risk compared to the common ε3/ε3 genotype, and are significantly overrepresented among cognitively healthy individuals aged 85 and older.</p><p>The caveat, as noted in the cholesterol section, is that rs429358 was not on your chip — so we cannot fully exclude an ε2/ε4 mixed genotype. However, even ε2/ε4 carriers have attenuated risk compared to ε4/ε4 homozygotes, and the protective signal from ε2 is real and substantial regardless.</p><p>The GWAS data shows 50 elevated loci and a PGS of +171.6, which appears to contradict the APOE finding. This apparent contradiction is important to understand: the GWAS TSV for Alzheimer's contains many study types including education-Alzheimer pleiotropic studies (variants that affect both educational attainment and Alzheimer risk via shared pathways). The APOE genotype, which is the dominant factor in clinical Alzheimer risk, is not always the dominant driver of GWAS polygenic scores in research studies. Weight APOE status heavily in your interpretation.</p><p>Secondary loci: CLU CC (rs9331888) is a modest risk signal at the clusterin gene, which is involved in amyloid clearance. This is a small effect relative to APOE. The other curated loci (BIN1, CR1, PICALM) were either not on chip or showed no risk alleles in your data.</p><p>The overall Alzheimer picture is genuinely favourable given the ε2 signal. The most evidence-based protective behaviours — cardiovascular health maintenance, regular aerobic exercise, quality sleep (critical for amyloid clearance via the glymphatic system), and cognitive engagement — remain worthwhile regardless of genotype, and are especially effective in ε2 carriers who already have a protective biological baseline.</p>"}, "parkinson": {"name": "Parkinson's Disease", "bespoke": "<p>Parkinson's disease genetics revolve around lysosomal clearance, mitochondrial maintenance, and the handling of environmental toxins within dopaminergic neurons. While you lack high-penetrance familial mutations in LRRK2 or GBA, polygenic variants at loci like <strong>SNCA</strong> (alpha-synuclein) and <strong>MAPT</strong> (tau protein) suggest a slightly altered clearance rate for misfolded proteins.</p><p>Emerging research highlights that neuroinflammation and gut microbiome health are key epigenetic triggers for Parkinson's pathology. Actionable neuroprotective habits include regular vigorous aerobic exercise (which upregulates BDNF and supports dopaminergic pathway health), a diet rich in polyphenols (berries, cocoa, green tea), and maintaining healthy gut barrier function to avoid systemic inflammatory triggers.</p>"}, "depression": {"name": "Depression", "bespoke": "<p>Your depression genetics tell a nuanced story that requires careful context to interpret correctly. The headline — elevated genetic signal with 32 GWAS loci and PGS +71.8 — reflects genuine polygenic loading. But depression genetics have important interpretive limitations that are as important as the numbers themselves.</p><p>The most personally relevant findings are in the curated SNPs. BDNF rs6265 CT means you carry one copy of the Val66Met variant — the T (Met) allele is associated with reduced activity-dependent BDNF secretion. BDNF is the brain's primary neurotrophic factor, supporting neuronal survival, plasticity, and stress recovery. The Met allele has been associated with reduced hippocampal volume, increased anxiety response, and greater vulnerability to stress-induced mood changes. Importantly, BDNF levels are highly responsive to aerobic exercise — physical activity is one of the most robust BDNF upregulators known, and this is one mechanism by which exercise reduces depression risk.</p><p>COMT rs4680 GG is the Warrior profile (Val/Val) — higher dopamine breakdown in the prefrontal cortex, which typically means better stress resilience and executive function under pressure, at the cost of slightly lower baseline dopamine tone. For depression, this is generally neutral-to-protective rather than a risk factor.</p><p>NEGR1 AG (rs1545843) and TMEM161B TT (rs10514299) are the first wave of genome-wide significant depression hits, but their individual effect sizes are very small — important at the population level, less meaningful individually.</p><p>The overarching message: the BDNF Val66Met heterozygosity is the most interpretively meaningful finding here. It suggests somewhat higher biological sensitivity to stress and environmental adversity — not a predetermined outcome, but a profile that responds particularly well to protective factors: regular aerobic exercise (the most evidence-based BDNF upregulator), quality sleep, and strong social connection. These are not generic lifestyle advice — for your specific genotype, they have direct neurobiological relevance.</p>"}, "adhd": {"name": "ADHD", "bespoke": "<p>Attention-Deficit/Hyperactivity Disorder genetics are linked to the regulation of synaptic dopamine and norepinephrine transmission. Loci near the dopamine receptor D4 (<strong>DRD4</strong>) and dopamine transporter (<strong>DAT1</strong>) are frequently implicated. In individuals with these variants, the prefrontal cortex may clear dopamine from the synaptic cleft too rapidly, leading to a state of baseline under-arousal.</p><p>This is often experienced as a search for novelty, stimulation, or difficulty sustaining attention on low-salience tasks. Rather than a deficit, this profile is frequently associated with rapid task-switching, hyper-focus on high-interest subjects, and creative problem-solving. Supporting executive function through structured environments, dopamine-stabilizing foods (high protein, complex carbohydrates), and regular cardiovascular exercise is highly beneficial.</p>"}, "autism": {"name": "Autism", "bespoke": "<p>Autism spectrum genetics involve variants regulating synaptic cell adhesion molecules (such as neuroligins <strong>NLGN3/4</strong> and <strong>SHANK3</strong>) and neuronal wiring density. These genes guide how neurons connect and communicate during early development.</p><p>The polygenic score reflects a developmental tendency toward high local connectivity in specific brain regions, which can manifest as deep focus, hyper-systematizing, intense sensory sensitivity, and a preference for predictable, structured environments. This cognitive profile often excels in fields requiring pattern recognition, deep logical consistency, and sustained attention to detail. Managing sensory overload and leveraging structured schedules are key lifestyle supports.</p>"}, "bipolar_disorder": {"name": "Bipolar Disorder", "bespoke": "<p>Bipolar disorder genetics are closely tied to voltage-gated calcium channel subunits, specifically the <strong>CACNA1C</strong> and <strong>ANK3</strong> genes. These channels regulate intracellular calcium signaling, which is crucial for synaptic plasticity, neurotransmitter release, and circadian rhythm entrainment.</p><p>Variants in these genes can lead to hyper-excitability in neural networks, making mood states and energy levels more vulnerable to circadian disruptions. The most powerful stabilizing tool for this genetic profile is strict sleep hygiene—maintaining consistent sleep/wake times stabilizes calcium channel activity and acts as a biological shield against mood instability. Avoiding blue light exposure at night and limiting evening stimulants are key behavioral recommendations.</p>"}, "schizophrenia": {"name": "Schizophrenia", "bespoke": "<p>The schizophrenia GWAS signal deserves careful contextualisation before anything else is said. Your PGS of +125.2 and 29 elevated loci sound alarming, but this requires two important corrections before interpretation.</p><p>First, schizophrenia polygenic risk scores have very poor individual predictive value. Even in the highest PGS decile of the general population, lifetime schizophrenia incidence remains around 3-4% — compared to ~1% population baseline. The score distinguishes statistical groups, not individuals. The vast majority of people with high schizophrenia PGS never develop the condition.</p><p>Second, the specific variants driving your elevated score include several with very high ORs from small studies (rs117673608 at PRKN with OR 26.32, rs7116879 at DKK3 with OR 14.70). Large ORs in GWAS almost always reflect either population-specific effects, small study sizes with inflated estimates, or rare variants with limited generalisability. The schizophrenia GWAS literature has known issues with winner's curse and population stratification in some datasets.</p><p>The most meaningful biological signal here is the HLA/MHC component — many schizophrenia risk variants cluster in the major histocompatibility complex, reflecting the well-established immune and complement system involvement in schizophrenia pathophysiology. This shared genetic architecture with immune conditions (you also show elevated signals for lupus, rheumatoid arthritis, and inflammatory bowel disease) suggests a genuine biological theme of immune pathway sensitivity rather than classic psychiatric risk in isolation.</p><p>There is no actionable clinical recommendation from this finding beyond what applies to everyone: good sleep, limited cannabis use (the strongest environmental schizophrenia risk factor in genetically susceptible individuals), and maintaining social and cognitive engagement.</p>"}, "sleep_duration": {"name": "Sleep Duration", "bespoke": "<p>Genetic determinants of sleep duration are closely linked to the core circadian molecular clock (<strong>CLOCK</strong>, <strong>PER2</strong>) and sleep homeostatic mechanisms. Variants in these pathways influence how rapidly your brain builds up sleep pressure (adenosine accumulation) and how efficiently it clears metabolic waste during slow-wave sleep.</p><p>If you carry variants associated with shorter or longer sleep requirements, your body's natural homeostatic set point is shifted. Respecting this baseline is essential: regardless of duration, optimizing sleep quality (dark, cool room, no blue light before bed) ensures your glymphatic system can fully execute its nightly cleanup process. Chronic restriction of natural sleep requirements can lead to accelerated cognitive decline and metabolic dysfunction.</p>"}, "longevity": {"name": "Longevity", "bespoke": "<p>Your longevity genetics show moderate positive signals, with the APOE picture being the centrepiece. As noted in the Alzheimer section, rs7412 CC corresponds to the APOE ε2 allele — and ε2 is consistently overrepresented among centenarians in multiple independent cohort studies. The mechanism is multifactorial: lower LDL, reduced neuroinflammation, more efficient lipid metabolism, and lower Alzheimer risk all contribute to the survival advantage.</p><p>The CETP variants add genuine additional longevity signal. CETP rs3764814 CT (one protective C allele) and CETP rs5882 AG (one protective allele) both point toward higher HDL cholesterol — and elevated HDL has been consistently associated with longevity in centenarian studies, particularly in Ashkenazi Jewish and Japanese cohorts. The CETP variants work by reducing cholesterol ester transfer activity, allowing HDL particles to remain larger and more functional for longer.</p><p>FOXO3 was not on your chip — this is the single most replicated longevity locus outside APOE, active across five independent national cohorts. It is worth checking via a clinical or research genetic test if longevity genetics are of particular interest to you.</p><p>The GWAS shows 18 longevity-associated loci with PGS +62.4. Combined with the APOE ε2 signal and CETP variants, the overall longevity picture is moderately favourable at the genetic level. The evidence across all longevity studies consistently shows that lifestyle factors — particularly avoiding smoking, regular physical activity, Mediterranean-style diet, and maintaining social engagement — explain more variance in reaching exceptional age than genetics does. Your genetics provide a reasonable starting position; what you do with it matters more.</p>"}, "lactase_persistence": {"name": "Lactase Persistence", "bespoke": "<p>Your lactase genetics analyze the <strong>MCM6</strong> gene, which acts as the regulatory enhancer for the <strong>LCT</strong> gene encoding the lactase enzyme. In ancestral humans, lactase production was downregulated after weaning. However, a single nucleotide polymorphism (rs4988235) in MCM6 arose in European pastoralist populations, allowing continuous lactase expression into adulthood (lactase persistence).</p><p>If you carry the ancestral GG genotype, you are genetically predisposed to primary lactase deficiency, meaning lactose intake will cause digestive distress due to fermentation by gut bacteria. If you carry the derived AA or AG genotype, your body continues to produce lactase, allowing comfortable digestion of dairy products. If lactose intolerant, focusing on fermented dairy (kefir, aged cheeses) or lactase enzyme supplementation is recommended.</p>"}}, "immune_themes": {"Lupus": {"gene": "STAT4 and IRF5", "pathway": "interferon signalling", "management": "sun protection and stress management"}, "Rheumatoid Arthritis": {"gene": "HLA-DQB1 and TYK2", "pathway": "HLA-mediated autoimmunity", "management": "early joint symptom monitoring"}, "Inflammatory Bowel": {"gene": "IL23R and HLA-DRB9", "pathway": "intestinal immune regulation", "management": "dietary triggers and microbiome health"}, "Crohn Disease": {"gene": "IL23R (multiple hits)", "pathway": "IL-23/Th17 pathway dysregulation", "management": "dietary and stress management"}, "Psoriasis": {"gene": "TYK2 and IL12B", "pathway": "IL-23/IL-17 inflammatory axis", "management": "skin monitoring and UV management"}, "Multiple Sclerosis": {"gene": "HLA-DRB1 and IL2RA", "pathway": "myelin auto-reactivity and immune training", "management": "maintaining Vitamin D levels (>50 ng/mL)"}, "Asthma": {"gene": "ORMDL3/GSDMB and IL33", "pathway": "epithelial barrier and Th2 hyperresponsiveness", "management": "avoiding airway allergens and supporting mucosal health"}}, "cancer_specifics": {"Breast Cancer": "rs637644 GG (OR 32.50) and rs3844412 AA (OR 5.22) are the headline hits, but these ORs likely reflect population-specific or rare variant effects rather than common risk applicable to all ancestries. rs78378222 TT at TP53 is more universally relevant — TP53 is the genome's master tumour suppressor, and this intronic variant has been associated with modest breast cancer risk across multiple populations. rs140068132 AA at ESR1 (oestrogen receptor alpha) reflects the hormone-pathway component of breast cancer genetics. Standard screening recommendations apply; if family history of breast or ovarian cancer exists, clinical BRCA1/2 testing is more informative than polygenic scores for high-penetrance risk.", "Prostate Cancer": "rs17632542 TT at KLK3 (the PSA gene itself) and rs138213197 CC at HOXB13 are the most clinically relevant hits. HOXB13 G84E is a rare but high-risk variant for prostate cancer — however, CC at rs138213197 is the common non-G84E allele, so this may reflect a nearby regulatory variant rather than the high-risk coding change. KLK3 variants affect PSA levels independently of prostate cancer, which complicates PSA-based screening interpretation for carriers. Discussing this with a urologist before any PSA testing would be worthwhile.", "Colorectal Cancer": "Several hits show very high ORs (rs10920654 OR 76.85, rs78144988 OR 54.90) which almost certainly reflect population-specific rare variants rather than common risk. The more robustly replicated signals are rs885036 AA at MGAT4A and rs716897 TT at RASGRF2. Lifestyle modification is highly effective for colorectal cancer: high dietary fibre, limited red and processed meat, regular physical activity, and colonoscopy screening from age 45-50. Aspirin has demonstrated protective effects in high-genetic-risk individuals in some trials.", "Melanoma": "The melanoma signal is particularly coherent and actionable. SLC45A2 GG (rs16891982 and rs35407, both elevated OR ~2.0) is the ancestral darker pigmentation allele — but here it appears in the melanoma data because some studies find this allele pattern in melanoma cohorts reflecting ancestry confounding. More relevant is IRF4 CT (rs12203592, OR 1.76) — IRF4 genuinely affects melanocyte biology and melanoma risk. TP53 TT (rs78378222) is a cross-cancer signal. Combined with your TYR CA melanin-reducing variant from the pigmentation analysis, the UV sensitivity picture is clear and actionable: consistent SPF50, annual skin checks, and shade-seeking behaviour are genuinely warranted for your specific genetic profile. Melanoma caught at Stage I has >95% five-year survival.", "Lung Cancer": "rs17879961 AA at CHEK2 is the dominant signal, appearing multiple times with ORs of 1.54-2.63. CHEK2 is a DNA damage checkpoint gene — carriers of loss-of-function variants have elevated risk across multiple cancer types including lung, breast, and colorectal. However, rs17879961 is an intronic variant, not the classic CHEK2 I157T coding change, so its functional significance is less certain. rs11571818 TT at BRCA2 is also notable — again an intronic variant near rather than within the high-risk coding region. The critical contextual point: genetic lung cancer risk is dominated and modified by smoking status. If you are a non-smoker, your absolute lung cancer risk from these variants is very low. If you smoke, these variants represent genuine additional risk on top of the dominant environmental factor.", "Bladder Cancer": "Your bladder cancer risk profile highlights variants in xenobiotic metabolism, notably NAT2 slow-acetylation genotypes and GSTM1 null genotypes. This reduces the tissue's capacity to detoxify environmental toxins, letting them remain in the bladder for longer and increasing DNA damage. Non-negotiable advice: avoid tobacco smoke completely and maintain high daily fluid intake."}, "lifestyle_specifics": {"Alcohol Consumption": "<p>Your alcohol genetics contain the most striking individual OR in this entire report: rs1229984 CC at ADH1B with OR 24.56. This requires careful interpretation. ADH1B encodes alcohol dehydrogenase, which converts alcohol to acetaldehyde. The CC genotype at rs1229984 is associated with slower ADH1B activity — meaning acetaldehyde accumulates more slowly, which in some populations is associated with higher alcohol consumption because the aversive flushing effect is reduced. However, an OR of 24.56 for alcohol consumption quantity (not a disease outcome) reflects the enormous population-level variation in drinking behaviour, not a personal risk for any specific harm.</p><p>rs13107325 CC at SLC39A8 (OR 11.45) and rs1260326 CC at GCKR (OR 7.39-8.22) are additional metabolic variants associated with alcohol-related traits. GCKR is a glucokinase regulatory protein that affects both alcohol and glucose metabolism — its CC genotype is the risk allele here.</p><p>The practical interpretation: these variants may reflect differences in alcohol metabolism efficiency and reward pathway response. They do not predict alcohol use disorder — that is a complex behavioural outcome with distinct genetics. What they do suggest is awareness of individual metabolic response to alcohol, particularly given the triglyceride picture (APOA5 AG means alcohol has a disproportionate effect on your triglyceride levels).</p>", "Caffeine Metabolism": "<p>rs56113850 TC at CYP2A6 drives your caffeine signal, appearing three times with ORs of 4.59-9.59. CYP2A6 is primarily known for nicotine metabolism but also contributes to caffeine breakdown. The heterozygous TC genotype suggests intermediate metabolic activity at this locus.</p><p>The primary caffeine metabolism gene — CYP1A2 — was not directly captured in your GWAS data, which limits the interpretation. CYP1A2 is the enzyme that handles roughly 95% of caffeine clearance, and its variants (particularly rs762551) are the strongest determinants of whether you are a fast or slow caffeine metaboliser. A direct CYP1A2 genotype test would give a clearer picture of your optimal caffeine timing.</p><p>The practical takeaway from CYP2A6 TC: likely intermediate caffeine metabolism. If you notice caffeine affecting sleep quality even when consumed in the early afternoon, this is consistent with a slower-than-average clearance profile — cutting off caffeine by noon rather than 2-3pm would be a worthwhile experiment.</p>", "Pharmacogenomics": "<p>Your pharmacogenomics GWAS data captured three elevated loci: rs77375493 GG at JAK2 (OR 1.94), rs749671 GA at ZNF646 (OR 20.40), and rs245880 AG at CPVL (OR 4.69). The very high OR for rs749671 likely reflects a population-specific or rare variant effect rather than a broadly applicable drug response signal.</p><p>The most clinically actionable pharmacogenomics variants — CYP2D6, CYP2C19, CYP2C9, TPMT, DPYD — were not captured in this GWAS dataset. These are the variants that directly affect metabolism of commonly prescribed drugs including antidepressants, antipsychotics, blood thinners, and chemotherapy agents.</p><p>If you are starting any new medication — particularly antidepressants, antiplatelet drugs (clopidogrel), or pain medications involving codeine or tramadol — a pharmacogenomics panel from a clinical genetics service is worth discussing with your prescriber. These panels cost £100-300 and can prevent ineffective dosing or adverse reactions that would otherwise only be discovered through trial and error.</p>"}, "generic": {"immune_base": "<p>Your {trait} genetics show elevated signal, driven primarily by {gene} variants affecting the {pathway}. With {elevated} elevated loci and a PGS of {pgs:+.1f}, this is a meaningful genetic signal rather than statistical noise.</p><p>An important pattern across your immune profile: elevated signals appear consistently across lupus, rheumatoid arthritis, inflammatory bowel disease, Crohn's disease, and psoriasis. This is not coincidental. These conditions share genetic architecture — particularly in the HLA region and cytokine signalling pathways. TYK2 GG (rs34536443) appears in both your psoriasis and rheumatoid arthritis data, and IL23R variants drive both your Crohn's and inflammatory bowel signals. This pattern suggests a genuine underlying theme of immune pathway sensitivity rather than five independent risk elevations.</p><p>The shared genetic basis of these autoimmune conditions means that the same lifestyle factors that reduce one tend to reduce others: anti-inflammatory diet (Mediterranean pattern, omega-3s, low processed food), stress management, adequate sleep, and maintaining a diverse gut microbiome. Practical focus: {management}. These are real biological levers, not generic advice, for someone with this immune genetic profile.</p><p>It is worth being aware of this cluster when discussing family history with your GP — autoimmune conditions are frequently underdiagnosed, and having a clear picture of your genetic predispositions can inform appropriate monitoring thresholds.</p>", "cancer_base": "<p>Your {trait} GWAS data shows {elevated} elevated loci with a PGS of {pgs:+.1f}.</p><p>{detail}</p>", "gwas_summary_base": "<p>{pred} for {trait}. The GWAS polygenic score is {pgs:+.1f} (above population average), with {elevated} loci showing elevated risk allele dosage. Key genes implicated include {genes}.</p><p>{narrative}</p>"}}, "bg": {"meta": {"title_suffix": "— Генетичен здравен наратив", "eyebrow": "Персонален геномичен доклад", "subtitle": "Генетичен здравен наратив", "contents": "Съдържание", "traits_label": "Анализирани черти", "elevated_label": "Повишен", "favourable_label": "Благоприятен", "moderate_label": "Умерен", "generated_label": "Генериран", "disclaimer": "<strong>Важно:</strong> Този доклад е само за образователни цели — не е медицинска диагноза. Генетичната предразположеност не определя автоматично здравните резултати. Моля, обсъдете всички тревожни находки с квалифициран медицински специалист.", "search_placeholder": "Търсене на черти, гени или нива на риск...", "dark_mode_toggle": "Тъмнен/Светъл режим", "all_traits": "Всички категории", "overview_title": "Вашата генетична история — Голямата картина", "overview_text": "<p>След преглед на пълния ви генетичен профил се очертава ясна и последователна история. Нямате тежки моногенни заболявания, но имате умерено генетично натоварване в няколко взаимосвързани системи. Моделът е ясен:</p><ul><li><strong>Кардиометаболитна ос</strong> — умерена предразположеност към по-високи липиди, чувствителност на кръвното налягане и предизвикателства с метаболитната ефективност.</li><li><strong>Имунна и възпалителна регулация</strong> — последователно повишени сигнали при множество автоимунни и възпалителни състояния.</li><li><strong>Неврологично здраве</strong> — сигнали в регулацията на настроението, риска от невродегенерация и когнитивното представяне под стрес.</li></ul><p>Общата биологична тема, преминаваща през вашия профил, е <strong>възпалението и метаболитната устойчивост</strong>. Тялото ви изглежда функционира малко по-интензивно във възпалителните пътища и е по-малко ефективно в определени процеси на защита и възстановяване. Това не е необичайно и се повлиява отлично от начина на живот.</p><p><strong>Областите с най-голямо влияние за вас са:</strong></p><ol><li><strong>Редовна физическа активност</strong> — особено комбинация от аеробни тренировки и тренировки със съпротивление. Това влияе положително на трите основни системи (кардиометаболитна, имунна и когнитивна).</li><li><strong>Противовъзпалително хранене</strong> — средиземноморски тип диета, висок прием на омега-3, адекватни нива на витамин D и магнезий.</li><li><strong>Сън и управление на стреса</strong> — критични за имунната регулация и когнитивното здраве.</li></ol><p>Генетиката ви осигурява и ясни предимства в други области (ръст, когнитивен потенциал, защитни варианти). Общата картина не показва неизбежно заболяване, а специфични уязвимости, които реагират много добре на целенасочени интервенции.</p><p>Това е вашата карта. Теренът е известен. Какво ще направите с него, зависи изцяло от вас.</p>", "gwas_summary_header": "GWAS Резюме", "deeper_analysis_header": "Дълбок анализ"}, "traits": {"eye_color": {"name": "Цвят на очите", "bespoke": "<p>Прогнозата за цвета на очите попада на границата между синьо и зелено, което е точно там, където я поставя вашата генотипна комбинация. Доминиращият сигнал е rs12913832 GG — тази единична вариация в гена HERC2 е най-силният известен предиктор за цвета на очите при хората. GG е класическият генотип, свързан със сини очи, открит при около 97% от синеоките европейци. Сам по себе си той би предсказал сини очи.</p><p>Зеленият елемент се въвежда от комбинацията от вторични сигнали, действащи в различни посоки. SLC24A4 GT и IRF4 CT са и двете междинни — те нито засилват напълно синия сигнал, нито го насочват към кафяво. SLC45A2 GG е предковият алел, който не допринася за европейския вариант на изсветляване, добавяйки малък противовес. TYR AG (хетерозиготен) намалява умерено синтеза на меланин в различни тъкани, включително ириса.</p><p>Крайният резултат: силно намален OCA2-медииран меланинов сигнал от HERC2, частично модулиран от междинни алели в поддържащите локуси. Това произвежда ирис, по-светъл от кафявия, с конкретен нюанс, намиращ се между синьо и зелено в зависимост от условията на осветление и структурата на ириса. Синьо-зелено или зелено-синьо са напълно възможни фенотипни резултати. Кафявото е практически изключено — нямате нито една от класическите алелни комбинации, промотиращи кафяво, на ключовите локуси.</p><p>Една практическа бележка: ефектът на TYR
